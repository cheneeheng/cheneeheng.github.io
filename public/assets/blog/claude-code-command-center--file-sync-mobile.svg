<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 598" role="img" aria-label="Two folders kept in sync newer-wins in both directions, a raw copy clobbering a machine-specific settings key, and a merge that keeps that key while newer values win">
