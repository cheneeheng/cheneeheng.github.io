<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" role="img" aria-label="A live agent-to-server session being recorded to a cassette file, then the cassette replayed offline in place of the server">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#f8fafc" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="400" height="340" fill="url(#bg)"/>
  <rect width="400" height="340" fill="url(#dots)"/>
  <rect width="400" height="340" fill="url(#glow)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="middle">
    <rect x="14" y="14" width="110" height="30" rx="6" fill="#0b1120" stroke="#475569" stroke-opacity="0.55"/><text x="69.0" y="33.3" font-size="12" fill="#e2e8f0">agent</text>
    <rect x="276" y="14" width="110" height="30" rx="6" fill="#0b1120" stroke="#475569" stroke-opacity="0.55"/><text x="331.0" y="33.3" font-size="12" fill="#e2e8f0">server</text>
    <line x1="132" y1="24" x2="260.0" y2="24.0" stroke="#64748b" stroke-width="2" stroke-linecap="round"/><path d="M268 24 L258.0 19.0 L258.0 29.0 z" fill="#64748b"/>
    <line x1="268" y1="36" x2="140.0" y2="36.0" stroke="#64748b" stroke-width="2" stroke-linecap="round"/><path d="M132 36 L142.0 41.0 L142.0 31.0 z" fill="#64748b"/>
    <circle cx="64" cy="60" r="5" fill="#f87171"/>
    <text x="76" y="64" font-size="11" fill="#f87171" text-anchor="start">REC · every run calls the model</text>
    <rect x="80" y="80" width="240" height="140" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="2"/>
    <rect x="96" y="92" width="208" height="24" rx="5" fill="#0b1120" stroke="#334155"/>
    <text x="200" y="108" font-size="12" fill="#7dd3fc">session.mcp.json</text>
    <rect x="120" y="126" width="160" height="60" rx="10" fill="#0b1120" stroke="#334155"/>
    <path d="M160 180 Q 200 190 240 180" fill="none" stroke="#475569" stroke-width="3"/>
    <circle cx="160" cy="156" r="20" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.7" stroke-width="2"/>
    <circle cx="160" cy="156" r="6" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <line x1="160" y1="150" x2="160" y2="140" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="2" transform="rotate(0 160 156)"/>
    <line x1="160" y1="150" x2="160" y2="140" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="2" transform="rotate(120 160 156)"/>
    <line x1="160" y1="150" x2="160" y2="140" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="2" transform="rotate(240 160 156)"/>
    <circle cx="240" cy="156" r="20" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.7" stroke-width="2"/>
    <circle cx="240" cy="156" r="6" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <line x1="240" y1="150" x2="240" y2="140" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="2" transform="rotate(0 240 156)"/>
    <line x1="240" y1="150" x2="240" y2="140" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="2" transform="rotate(120 240 156)"/>
    <line x1="240" y1="150" x2="240" y2="140" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="2" transform="rotate(240 240 156)"/>
    <path d="M110 220 L 124 198 H 276 L 290 220" fill="#0f172a" stroke="#334155"/>
    <path d="M92 230 l16 10 l-16 10 z" fill="#38bdf8"/>
    <text x="116" y="245" font-size="12" fill="#38bdf8" text-anchor="start">replay</text>
    <line x1="176" y1="240" x2="216.0" y2="240.0" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/><path d="M224 240 L214.0 235.0 L214.0 245.0 z" fill="#38bdf8"/>
    <rect x="230" y="226" width="156" height="28" rx="6" fill="#0b1120" stroke="#38bdf8" stroke-opacity="0.55"/><text x="308.0" y="244.3" font-size="12" fill="#e2e8f0">agent</text>
    <text x="200" y="280" font-size="11" fill="#94a3b8">no network · no key · instant</text>
    <rect x="70" y="294" width="260" height="26" rx="6" fill="#0b1120" stroke="#38bdf8" stroke-opacity="0.55"/><text x="200.0" y="311.0" font-size="11" fill="#7dd3fc">MCP_CASSETTE_MODE=none</text>
  </g>
</svg>
