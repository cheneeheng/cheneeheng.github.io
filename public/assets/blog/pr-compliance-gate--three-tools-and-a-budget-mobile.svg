<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" role="img" aria-label="A sub-agent with three read-only tools inside a sandbox, its turn, tool-call, and byte budgets counted outside it by the harness">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.15" r="0.8">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#f8fafc" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="400" height="340" fill="url(#bg)"/>
  <rect width="400" height="340" fill="url(#dots)"/>
  <rect width="400" height="340" fill="url(#glow)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="middle">
    <rect x="14" y="14" width="372" height="160" rx="16" fill="none" stroke="#a78bfa" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="30" y="36" font-size="11" fill="#a78bfa" text-anchor="start">sandbox · read-only</text>
    <rect x="120" y="48" width="160" height="40" rx="20" fill="#1e293b" stroke="#a78bfa" stroke-opacity="0.7"/>
    <text x="200" y="73" font-size="14" fill="#e2e8f0">investigator</text>
    <line x1="200" y1="88" x2="81" y2="116" stroke="#475569" stroke-width="1.5"/>
    <rect x="26" y="116" width="110" height="28" rx="6" fill="#0b1120" stroke="#a78bfa" stroke-opacity="0.55"/><text x="81.0" y="134.3" font-size="12" fill="#c4b5fd">read_file</text>
    <line x1="200" y1="88" x2="199" y2="116" stroke="#475569" stroke-width="1.5"/>
    <rect x="144" y="116" width="110" height="28" rx="6" fill="#0b1120" stroke="#a78bfa" stroke-opacity="0.55"/><text x="199.0" y="134.3" font-size="12" fill="#c4b5fd">grep_repo</text>
    <line x1="200" y1="88" x2="317" y2="116" stroke="#475569" stroke-width="1.5"/>
    <rect x="262" y="116" width="110" height="28" rx="6" fill="#0b1120" stroke="#a78bfa" stroke-opacity="0.55"/><text x="317.0" y="134.3" font-size="12" fill="#c4b5fd">list_dir</text>
    <text x="200" y="162" font-size="11" fill="#64748b">no write · no exec · no net</text>
    <text x="200" y="202" font-size="12" fill="#94a3b8">the harness counts, not the model</text>
    <text x="16" y="231" font-size="11" fill="#c4b5fd" text-anchor="start">MAX_TURNS</text>
    <rect x="150" y="220" width="220" height="14" rx="7" fill="#0b1120" stroke="#334155"/>
    <rect x="150" y="220" width="121" height="14" rx="7" fill="#a78bfa" fill-opacity="0.5"/>
    <line x1="370" y1="216" x2="370" y2="238" stroke="#f87171" stroke-width="2"/>
    <text x="16" y="259" font-size="11" fill="#c4b5fd" text-anchor="start">MAX_TOOL_CALLS</text>
    <rect x="150" y="248" width="220" height="14" rx="7" fill="#0b1120" stroke="#334155"/>
    <rect x="150" y="248" width="176" height="14" rx="7" fill="#a78bfa" fill-opacity="0.5"/>
    <line x1="370" y1="244" x2="370" y2="266" stroke="#f87171" stroke-width="2"/>
    <text x="16" y="287" font-size="11" fill="#c4b5fd" text-anchor="start">MAX_FILE_CHARS</text>
    <rect x="150" y="276" width="220" height="14" rx="7" fill="#0b1120" stroke="#334155"/>
    <rect x="150" y="276" width="77" height="14" rx="7" fill="#a78bfa" fill-opacity="0.5"/>
    <line x1="370" y1="272" x2="370" y2="294" stroke="#f87171" stroke-width="2"/>
    <text x="200" y="324" font-size="12" fill="#c4b5fd">out of budget -> inconclusive -> human</text>
  </g>
</svg>
