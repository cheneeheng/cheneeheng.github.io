<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" role="img" aria-label="A review pipeline split into a cheap green path and an expensive orange path, with two gates controlling which traffic reaches the expensive one">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#f8fafc" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="400" height="340" fill="url(#bg)"/>
  <rect width="400" height="340" fill="url(#dots)"/>
  <rect width="400" height="340" fill="url(#glow)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="middle">
    <rect x="14" y="10" width="372" height="86" rx="12" fill="#4ade80" fill-opacity="0.08" stroke="#4ade80" stroke-opacity="0.45"/>
    <rect x="24" y="20" width="172" height="24" rx="6" fill="#0b1120" stroke="#4ade80" stroke-opacity="0.55"/><text x="110.0" y="36.0" font-size="11" fill="#86efac">classify · haiku</text>
    <rect x="204" y="20" width="172" height="24" rx="6" fill="#0b1120" stroke="#4ade80" stroke-opacity="0.55"/><text x="290.0" y="36.0" font-size="11" fill="#86efac">risk_score · haiku</text>
    <text x="200" y="64" font-size="11" fill="#94a3b8">the cheap path</text>
    <text x="200" y="84" font-size="11" fill="#4ade80">most reviews end here</text>
    <path d="M14 96 H 386 L 340 124 H 60 z" fill="#a78bfa" fill-opacity="0.06"/>
    <line x1="60" y1="126" x2="340" y2="126" stroke="#a78bfa" stroke-width="3"/>
    <text x="346" y="130" font-size="10" fill="#a78bfa" text-anchor="start">gate 1</text>
    <rect x="60" y="132" width="280" height="74" rx="10" fill="#fb923c" fill-opacity="0.08" stroke="#fb923c" stroke-opacity="0.45"/>
    <rect x="70" y="140" width="126" height="22" rx="6" fill="#0b1120" stroke="#fb923c" stroke-opacity="0.55"/><text x="133.0" y="155.0" font-size="11" fill="#fdba74">security</text>
    <rect x="204" y="140" width="126" height="22" rx="6" fill="#0b1120" stroke="#fb923c" stroke-opacity="0.55"/><text x="267.0" y="155.0" font-size="11" fill="#fdba74">license</text>
    <text x="200" y="178" font-size="10" fill="#94a3b8">sonnet</text>
    <text x="200" y="197" font-size="11" fill="#fb923c">where the money goes</text>
    <path d="M60 206 H 340 L 290 228 H 110 z" fill="#a78bfa" fill-opacity="0.06"/>
    <line x1="110" y1="230" x2="290" y2="230" stroke="#a78bfa" stroke-width="3"/>
    <text x="296" y="234" font-size="10" fill="#a78bfa" text-anchor="start">gate 2</text>
    <rect x="110" y="236" width="180" height="34" rx="8" fill="#f87171" fill-opacity="0.08" stroke="#f87171" stroke-opacity="0.45"/>
    <text x="200" y="257" font-size="11" fill="#fca5a5">investigate · agent sdk</text>
    <line x1="200" y1="272" x2="200.0" y2="284.0" stroke="#64748b" stroke-width="2" stroke-linecap="round"/><path d="M200 292 L205.0 282.0 L195.0 282.0 z" fill="#64748b"/>
    <rect x="130" y="294" width="140" height="26" rx="6" fill="#0b1120" stroke="#a78bfa" stroke-opacity="0.55"/><text x="200.0" y="311.0" font-size="11" fill="#c4b5fd">human_gate</text>
    <text x="200" y="336" font-size="10" fill="#94a3b8">a person still says yes</text>
  </g>
</svg>
