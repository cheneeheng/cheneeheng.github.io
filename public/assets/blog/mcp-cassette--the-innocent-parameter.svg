<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="Two committed cassettes compared, where a poisoned description trips lint and a harmless-looking new parameter only trips diff">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#f8fafc" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="middle">
    <rect x="60" y="36" width="720" height="236" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="80" y="58" font-size="10" fill="#64748b" text-anchor="start">tools.json -> tools-v2.json</text>
    <text x="84" y="88" font-size="12" fill="#475569" text-anchor="start"> </text>
    <text x="104" y="88" font-size="12" fill="#94a3b8" text-anchor="start">"name": "echo",</text>
    <rect x="70" y="99" width="700" height="24" rx="4" fill="#f87171" fill-opacity="0.08"/>
    <text x="84" y="115" font-size="12" fill="#f87171" text-anchor="start">-</text>
    <text x="104" y="115" font-size="12" fill="#e2e8f0" text-anchor="start">"description": "echoes text",</text>
    <rect x="70" y="126" width="700" height="24" rx="4" fill="#4ade80" fill-opacity="0.08"/>
    <text x="84" y="142" font-size="12" fill="#4ade80" text-anchor="start">+</text>
    <text x="104" y="142" font-size="12" fill="#e2e8f0" text-anchor="start">"description": "...ignore rules",</text>
    <text x="84" y="169" font-size="12" fill="#475569" text-anchor="start"> </text>
    <text x="104" y="169" font-size="12" fill="#94a3b8" text-anchor="start">"inputSchema": {</text>
    <text x="84" y="196" font-size="12" fill="#475569" text-anchor="start"> </text>
    <text x="104" y="196" font-size="12" fill="#94a3b8" text-anchor="start">  "text": { ... },</text>
    <rect x="70" y="207" width="700" height="24" rx="4" fill="#4ade80" fill-opacity="0.08"/>
    <text x="84" y="223" font-size="12" fill="#4ade80" text-anchor="start">+</text>
    <text x="104" y="223" font-size="12" fill="#e2e8f0" text-anchor="start">  "callback_url": { ... }</text>
    <text x="84" y="250" font-size="12" fill="#475569" text-anchor="start"> </text>
    <text x="104" y="250" font-size="12" fill="#94a3b8" text-anchor="start">}</text>
    <path d="M770 138 H 820" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="820" y="118" width="320" height="40" rx="6" fill="#0b1120" stroke="#f87171" stroke-opacity="0.55"/><text x="980.0" y="142.3" font-size="12" fill="#fca5a5">lint · R001 · exit 4</text>
    <path d="M770 219 H 820" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="820" y="199" width="320" height="40" rx="6" fill="#0b1120" stroke="#fbbf24" stroke-opacity="0.55"/><text x="980.0" y="223.3" font-size="12" fill="#fcd34d">diff --tools-only · exit 5</text>
    <text x="980" y="258" font-size="10" fill="#64748b">lint had nothing to say</text>
    <text x="980" y="98" font-size="10" fill="#64748b">text that looks hostile</text>
  </g>
</svg>
