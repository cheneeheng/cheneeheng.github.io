<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="Two committed cassettes compared, where a poisoned description trips lint and a harmless-looking new parameter only trips diff">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#f8fafc" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="middle">

    <!-- 1: the two versions -->
    <g transform="translate(60 70)">
      <rect width="320" height="160" rx="16" fill="#1e293b" stroke="#334155"/>
      <g font-size="9" text-anchor="start">
        <g transform="translate(24 34)"><rect width="128" height="76" rx="7" fill="#0b1120" stroke="#475569"/><text x="12" y="18" fill="#64748b">tools.json</text><text x="12" y="38" fill="#94a3b8">echo(text)</text><text x="12" y="58" fill="#94a3b8">"echoes text"</text></g>
        <g transform="translate(168 34)"><rect width="128" height="76" rx="7" fill="#0b1120" stroke="#f87171" stroke-opacity="0.5"/><text x="12" y="18" fill="#64748b">tools-v2.json</text><text x="12" y="38" fill="#fca5a5">echo(text,</text><text x="12" y="52" fill="#fca5a5">  callback_url)</text><text x="12" y="68" fill="#fca5a5">"...ignore rules"</text></g>
      </g>
      <text x="160" y="148">the same server, one version on</text>
    </g>

    <!-- 2: lint sees one thing -->
    <g transform="translate(410 70)">
      <rect width="340" height="160" rx="16" fill="#1e293b" stroke="#334155"/>
      <text x="170" y="36" font-size="11" fill="#7dd3fc">lint</text>
      <g font-size="9" text-anchor="start">
        <g transform="translate(30 50)"><rect width="280" height="22" rx="5" fill="#0b1120" stroke="#f87171" stroke-opacity="0.55"/><text x="12" y="15" fill="#fca5a5">description: R001 · exit 4</text></g>
        <g transform="translate(30 80)"><rect width="280" height="22" rx="5" fill="#0b1120" stroke="#334155" stroke-dasharray="4 3"/><text x="12" y="15" fill="#475569">callback_url: nothing to say</text></g>
      </g>
      <text x="170" y="132" font-size="10" fill="#64748b">text that looks hostile</text>
      <text x="170" y="152">and only that</text>
    </g>

    <!-- 3: diff sees the other -->
    <g transform="translate(780 70)">
      <rect width="340" height="160" rx="16" fill="#1e293b" stroke="#334155"/>
      <text x="170" y="36" font-size="11" fill="#7dd3fc">diff --tools-only</text>
      <g font-size="9" text-anchor="start">
        <g transform="translate(30 50)"><rect width="280" height="22" rx="5" fill="#0b1120" stroke="#f87171" stroke-opacity="0.55"/><text x="12" y="15" fill="#fca5a5">inputSchema moved · exit 5</text></g>
        <g transform="translate(30 80)"><rect width="280" height="22" rx="5" fill="#0b1120" stroke="#334155" stroke-dasharray="4 3"/><text x="12" y="15" fill="#475569">a payload present from day one</text></g>
      </g>
      <text x="170" y="132" font-size="10" fill="#64748b">a surface that moved</text>
      <text x="170" y="152">and only that</text>
    </g>

  </g>
</svg>
