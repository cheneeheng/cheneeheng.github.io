<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="An open journal: the left page holds lines of writing, the right page a small neural network, with a ribbon bookmark and sparkles around it">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#f8fafc" fill-opacity="0.05"/>
    </pattern>
    <path id="spark" d="M0,-10 L2.5,-2.5 L10,0 L2.5,2.5 L0,10 L-2.5,2.5 L-10,0 L-2.5,-2.5 Z"/>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <g fill="#a78bfa">
    <use href="#spark" transform="translate(250 90)" fill-opacity="0.6"/>
    <use href="#spark" transform="translate(180 210) scale(0.6)" fill-opacity="0.4"/>
    <use href="#spark" transform="translate(960 110) scale(0.8)" fill-opacity="0.5"/>
    <use href="#spark" transform="translate(1030 215)" fill-opacity="0.35"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="middle">

    <!-- left page: the journal entry -->
    <g transform="translate(330 50)">
      <rect width="270" height="200" rx="16" fill="#1e293b" stroke="#334155"/>
      <g stroke="#334155">
        <line x1="30" y1="66" x2="240" y2="66"/>
        <line x1="30" y1="90" x2="240" y2="90"/>
        <line x1="30" y1="114" x2="240" y2="114"/>
        <line x1="30" y1="138" x2="240" y2="138"/>
        <line x1="30" y1="162" x2="240" y2="162"/>
      </g>
      <g fill="#a78bfa">
        <rect x="30" y="58" width="190" height="4" rx="2" fill-opacity="0.85"/>
        <rect x="30" y="82" width="160" height="4" rx="2" fill-opacity="0.6"/>
        <rect x="30" y="106" width="205" height="4" rx="2" fill-opacity="0.75"/>
        <rect x="30" y="130" width="120" height="4" rx="2" fill-opacity="0.5"/>
        <rect x="30" y="154" width="175" height="4" rx="2" fill-opacity="0.65"/>
      </g>
    </g>

    <!-- right page: the agent -->
    <g transform="translate(600 50)">
      <rect width="270" height="200" rx="16" fill="#1e293b" stroke="#334155"/>
      <g stroke="#475569" stroke-width="1.2">
        <line x1="60" y1="74" x2="135" y2="58"/><line x1="60" y1="74" x2="135" y2="90"/><line x1="60" y1="74" x2="135" y2="122"/><line x1="60" y1="74" x2="135" y2="154"/>
        <line x1="60" y1="106" x2="135" y2="58"/><line x1="60" y1="106" x2="135" y2="90"/><line x1="60" y1="106" x2="135" y2="122"/><line x1="60" y1="106" x2="135" y2="154"/>
        <line x1="60" y1="138" x2="135" y2="58"/><line x1="60" y1="138" x2="135" y2="90"/><line x1="60" y1="138" x2="135" y2="122"/><line x1="60" y1="138" x2="135" y2="154"/>
        <line x1="135" y1="58" x2="210" y2="90"/><line x1="135" y1="58" x2="210" y2="122"/>
        <line x1="135" y1="90" x2="210" y2="90"/><line x1="135" y1="90" x2="210" y2="122"/>
        <line x1="135" y1="122" x2="210" y2="90"/><line x1="135" y1="122" x2="210" y2="122"/>
        <line x1="135" y1="154" x2="210" y2="90"/><line x1="135" y1="154" x2="210" y2="122"/>
      </g>
      <g fill="#a78bfa">
        <circle cx="60" cy="74" r="6" fill-opacity="0.6"/>
        <circle cx="60" cy="106" r="6" fill-opacity="0.6"/>
        <circle cx="60" cy="138" r="6" fill-opacity="0.6"/>
        <circle cx="135" cy="58" r="6" fill-opacity="0.8"/>
        <circle cx="135" cy="90" r="6" fill-opacity="0.8"/>
        <circle cx="135" cy="122" r="6" fill-opacity="0.8"/>
        <circle cx="135" cy="154" r="6" fill-opacity="0.8"/>
        <circle cx="210" cy="90" r="7"/>
        <circle cx="210" cy="122" r="7"/>
      </g>
    </g>

    <!-- spine and bookmark -->
    <line x1="600" y1="56" x2="600" y2="244" stroke="#475569" stroke-width="2"/>
    <polygon points="830,50 850,50 850,96 840,86 830,96" fill="#a78bfa"/>

  </g>
</svg>
