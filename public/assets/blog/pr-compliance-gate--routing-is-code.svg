<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="A rule ladder routing a review to investigate, human, or verdict, with accumulated stale findings blocking the clean path">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#f8fafc" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="middle">

    <!-- 1: the rule ladder -->
    <g transform="translate(90 70)">
      <rect width="300" height="160" rx="16" fill="#1e293b" stroke="#334155"/>
      <g font-size="10" text-anchor="start">
        <g transform="translate(28 38)"><rect width="244" height="20" rx="5" fill="#0b1120" stroke="#475569"/><text x="12" y="14" fill="#94a3b8">blocking / timeout -&gt; human</text></g>
        <g transform="translate(28 62)"><rect width="244" height="20" rx="5" fill="#0b1120" stroke="#475569"/><text x="12" y="14" fill="#94a3b8">needs_context + budget -&gt; investigate</text></g>
        <g transform="translate(28 86)"><rect width="244" height="20" rx="5" fill="#0b1120" stroke="#475569"/><text x="12" y="14" fill="#94a3b8">clean -&gt; verdict</text></g>
      </g>
      <text x="150" y="130" font-size="10" fill="#64748b">no model call</text>
      <text x="150" y="150">reconcile, in plain python</text>
    </g>

    <!-- 2: findings pile up -->
    <g transform="translate(450 70)">
      <rect width="300" height="160" rx="16" fill="#1e293b" stroke="#334155"/>
      <g font-size="9" text-anchor="start">
        <g transform="translate(34 36)"><rect width="232" height="18" rx="4" fill="#0b1120" stroke="#f87171" stroke-opacity="0.5"/><text x="10" y="13" fill="#fca5a5">round 1 · needs_more_context</text></g>
        <g transform="translate(34 58)"><rect width="232" height="18" rx="4" fill="#0b1120" stroke="#f87171" stroke-opacity="0.5"/><text x="10" y="13" fill="#fca5a5">round 1 · needs_more_context</text></g>
        <g transform="translate(34 80)"><rect width="232" height="18" rx="4" fill="#0b1120" stroke="#475569"/><text x="10" y="13" fill="#64748b">round 2 · clean</text></g>
        <g transform="translate(34 102)"><rect width="232" height="18" rx="4" fill="#0b1120" stroke="#475569"/><text x="10" y="13" fill="#64748b">round 2 · clean</text></g>
      </g>
      <text x="150" y="148">operator.add never forgets</text>
    </g>

    <!-- 3: the clean path unreachable -->
    <g transform="translate(810 70)">
      <rect width="300" height="160" rx="16" fill="#1e293b" stroke="#334155"/>
      <g font-size="10">
        <g transform="translate(38 40)"><rect width="224" height="24" rx="6" fill="#0b1120" stroke="#a78bfa" stroke-opacity="0.5"/><text x="112" y="16" fill="#c4b5fd">investigate, again</text></g>
        <g transform="translate(38 72)"><rect width="224" height="24" rx="6" fill="#0b1120" stroke="#475569"/><text x="112" y="16" fill="#64748b">budget drains -&gt; human</text></g>
        <g transform="translate(38 104)"><rect width="224" height="24" rx="6" fill="#0b1120" stroke="#334155" stroke-dasharray="4 3"/><text x="112" y="16" fill="#334155">clean verdict</text></g>
      </g>
      <text x="150" y="150">the last rung, unreachable</text>
    </g>

  </g>
</svg>
