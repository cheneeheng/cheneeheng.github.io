<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="A rule ladder routing a review to investigate, human, or verdict, with accumulated stale findings blocking the clean path">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#f8fafc" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="middle">
    <text x="80" y="44" font-size="10" fill="#64748b" text-anchor="start">reconcile · plain python · no model call</text>
    <line x1="80" y1="60" x2="80" y2="270" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <line x1="540" y1="60" x2="540" y2="270" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <line x1="80" y1="100" x2="540" y2="100" stroke="#334155" stroke-width="3"/>
    <rect x="110" y="84" width="400" height="32" rx="6" fill="#0b1120" stroke="#a78bfa" stroke-opacity="0.55"/><text x="310.0" y="104.3" font-size="12" fill="#c4b5fd">blocking / timeout -> human</text>
    <line x1="80" y1="164" x2="540" y2="164" stroke="#334155" stroke-width="3"/>
    <rect x="110" y="148" width="400" height="32" rx="6" fill="#0b1120" stroke="#fbbf24" stroke-opacity="0.55"/><text x="310.0" y="168.3" font-size="12" fill="#fcd34d">needs_context + budget -> investigate</text>
    <line x1="80" y1="228" x2="540" y2="228" stroke="#334155" stroke-width="3"/>
    <rect x="110" y="212" width="400" height="32" rx="6" fill="#0b1120" stroke="#475569" stroke-opacity="0.55" stroke-dasharray="4 4"/><text x="310.0" y="232.3" font-size="12" fill="#475569">clean -> verdict</text>
    <text x="310" y="262" font-size="10" fill="#64748b">unreachable</text>
    <text x="640" y="44" font-size="11" fill="#c4b5fd" text-anchor="start">findings  (operator.add)</text>
    <rect x="640" y="60" width="460" height="32" rx="6" fill="#0b1120" stroke="#f87171" stroke-opacity="0.55"/><text x="870.0" y="80.0" font-size="11" fill="#fca5a5">round 1 · needs_more_context</text>
    <rect x="640" y="102" width="460" height="32" rx="6" fill="#0b1120" stroke="#f87171" stroke-opacity="0.55"/><text x="870.0" y="122.0" font-size="11" fill="#fca5a5">round 1 · needs_more_context</text>
    <rect x="640" y="154" width="460" height="32" rx="6" fill="#0b1120" stroke="#475569" stroke-opacity="0.55"/><text x="870.0" y="174.0" font-size="11" fill="#94a3b8">round 2 · clean</text>
    <rect x="640" y="196" width="460" height="32" rx="6" fill="#0b1120" stroke="#475569" stroke-opacity="0.55"/><text x="870.0" y="216.0" font-size="11" fill="#94a3b8">round 2 · clean</text>
    <text x="870" y="150" font-size="14" fill="#64748b">+</text>
    <path d="M636 92 C 590 92, 590 164, 548 164" fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="5 4"/>
    <path d="M548 164 l10 -6 v12 z" fill="#f87171"/>
    <text x="870" y="262" font-size="11" fill="#94a3b8">the list never forgets round 1</text>
  </g>
</svg>
