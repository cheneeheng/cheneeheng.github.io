<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="Three separate faults — an event loop, a missing API key, and a lost structured-output guarantee — all producing the same silently broken sub-agent">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#f8fafc" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="middle">

    <!-- three causes -->
    <g transform="translate(60 54)">
      <g transform="translate(0 0)">
        <rect width="300" height="46" rx="9" fill="#1e293b" stroke="#f87171" stroke-opacity="0.45"/>
        <text x="150" y="20" font-size="10" fill="#fca5a5">SelectorEventLoop</text>
        <text x="150" y="35" font-size="9" fill="#64748b">cannot spawn a subprocess</text>
      </g>
      <g transform="translate(0 62)">
        <rect width="300" height="46" rx="9" fill="#1e293b" stroke="#f87171" stroke-opacity="0.45"/>
        <text x="150" y="20" font-size="10" fill="#fca5a5">ANTHROPIC_API_KEY</text>
        <text x="150" y="35" font-size="9" fill="#64748b">never reaches os.environ</text>
      </g>
      <g transform="translate(0 124)">
        <rect width="300" height="46" rx="9" fill="#1e293b" stroke="#f87171" stroke-opacity="0.45"/>
        <text x="150" y="20" font-size="10" fill="#fca5a5">function_calling</text>
        <text x="150" y="35" font-size="9" fill="#64748b">guarantee lost to thinking</text>
      </g>
    </g>

    <!-- converging arrows -->
    <g stroke="#64748b" stroke-width="1.8" fill="none" stroke-linecap="round">
      <path d="M370 77 C 410 77, 420 150, 460 150"/>
      <path d="M370 139 C 410 139, 420 150, 460 150"/>
      <path d="M370 201 C 410 201, 420 150, 460 150"/>
    </g>
    <path d="M462 150 l-12 -6 l0 12 z" fill="#64748b"/>

    <!-- one symptom -->
    <g transform="translate(480 100)">
      <rect width="260" height="100" rx="14" fill="#1e293b" stroke="#334155"/>
      <text x="130" y="42" font-size="11" fill="#94a3b8">one symptom</text>
      <text x="130" y="64" font-size="10" fill="#fca5a5">the investigator does nothing</text>
      <text x="130" y="82" font-size="9" fill="#64748b">every fix looks like it failed</text>
    </g>

    <!-- green suite -->
    <g transform="translate(790 100)">
      <rect width="350" height="100" rx="14" fill="#1e293b" stroke="#334155"/>
      <g transform="translate(28 26)">
        <rect width="294" height="24" rx="6" fill="#0b1120" stroke="#4ade80" stroke-opacity="0.55"/>
        <text x="147" y="16" font-size="10" fill="#86efac">100% of src/gate · all green</text>
      </g>
      <text x="175" y="76" font-size="10" fill="#64748b">every bug lived in the stubbed boundary</text>
    </g>

  </g>
</svg>
