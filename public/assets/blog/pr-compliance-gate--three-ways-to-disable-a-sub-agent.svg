<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="Three separate faults, an event loop, a missing API key, and a lost structured-output guarantee, all producing the same silently broken sub-agent">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#f8fafc" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="middle">
    <text x="60" y="56" font-size="11" fill="#94a3b8" text-anchor="start">src/gate</text>
    <rect x="160" y="44" width="820" height="16" rx="8" fill="#4ade80" fill-opacity="0.45"/>
    <text x="1000" y="57" font-size="12" fill="#4ade80" text-anchor="start">100% · all green</text>
    <line x1="60" y1="100" x2="1140" y2="100" stroke="#64748b" stroke-width="1.5" stroke-dasharray="10 6"/>
    <text x="60" y="90" font-size="10" fill="#64748b" text-anchor="start">stubbed boundary</text>
    <rect x="90" y="126" width="300" height="60" rx="12" fill="#1e293b" stroke="#f87171" stroke-opacity="0.55"/>
    <text x="240" y="152" font-size="12" fill="#fca5a5">SelectorEventLoop</text>
    <text x="240" y="172" font-size="10" fill="#64748b">cannot spawn a subprocess</text>
    <path d="M240 186 C 240 220, 600 210, 600 236" fill="none" stroke="#f87171" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="450" y="126" width="300" height="60" rx="12" fill="#1e293b" stroke="#f87171" stroke-opacity="0.55"/>
    <text x="600" y="152" font-size="12" fill="#fca5a5">ANTHROPIC_API_KEY</text>
    <text x="600" y="172" font-size="10" fill="#64748b">never reaches os.environ</text>
    <path d="M600 186 C 600 220, 600 210, 600 236" fill="none" stroke="#f87171" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="810" y="126" width="300" height="60" rx="12" fill="#1e293b" stroke="#f87171" stroke-opacity="0.55"/>
    <text x="960" y="152" font-size="12" fill="#fca5a5">function_calling</text>
    <text x="960" y="172" font-size="10" fill="#64748b">guarantee lost to thinking</text>
    <path d="M960 186 C 960 220, 600 210, 600 236" fill="none" stroke="#f87171" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="420" y="236" width="360" height="40" rx="12" fill="#0b1120" stroke="#f87171" stroke-opacity="0.7"/>
    <text x="600" y="261" font-size="11" fill="#fca5a5">one symptom: the investigator does nothing</text>
  </g>
</svg>
