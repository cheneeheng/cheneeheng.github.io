<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" role="img" aria-label="Two committed cassettes compared, where a poisoned description trips lint and a harmless-looking new parameter only trips diff">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#f8fafc" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="400" height="340" fill="url(#bg)"/>
  <rect width="400" height="340" fill="url(#dots)"/>
  <rect width="400" height="340" fill="url(#glow)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="middle">
    <rect x="14" y="10" width="372" height="206" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="28" y="30" font-size="10" fill="#64748b" text-anchor="start">tools.json -> tools-v2.json</text>
    <text x="28" y="55" font-size="11" fill="#475569" text-anchor="start"> </text>
    <text x="44" y="55" font-size="11" fill="#94a3b8" text-anchor="start">"name": "echo",</text>
    <rect x="20" y="64" width="360" height="22" rx="4" fill="#f87171" fill-opacity="0.08"/>
    <text x="28" y="79" font-size="11" fill="#f87171" text-anchor="start">-</text>
    <text x="44" y="79" font-size="11" fill="#e2e8f0" text-anchor="start">"description": "echoes text",</text>
    <rect x="20" y="88" width="360" height="22" rx="4" fill="#4ade80" fill-opacity="0.08"/>
    <text x="28" y="103" font-size="11" fill="#4ade80" text-anchor="start">+</text>
    <text x="44" y="103" font-size="11" fill="#e2e8f0" text-anchor="start">"description": "...ignore rules",</text>
    <text x="28" y="127" font-size="11" fill="#475569" text-anchor="start"> </text>
    <text x="44" y="127" font-size="11" fill="#94a3b8" text-anchor="start">"inputSchema": {</text>
    <text x="28" y="151" font-size="11" fill="#475569" text-anchor="start"> </text>
    <text x="44" y="151" font-size="11" fill="#94a3b8" text-anchor="start">  "text": { ... },</text>
    <rect x="20" y="160" width="360" height="22" rx="4" fill="#4ade80" fill-opacity="0.08"/>
    <text x="28" y="175" font-size="11" fill="#4ade80" text-anchor="start">+</text>
    <text x="44" y="175" font-size="11" fill="#e2e8f0" text-anchor="start">  "callback_url": { ... }</text>
    <text x="28" y="199" font-size="11" fill="#475569" text-anchor="start"> </text>
    <text x="44" y="199" font-size="11" fill="#94a3b8" text-anchor="start">}</text>
    <circle cx="368" cy="99" r="5" fill="#f87171"/>
    <circle cx="368" cy="171" r="5" fill="#fbbf24"/>
    <rect x="14" y="228" width="372" height="32" rx="6" fill="#0b1120" stroke="#f87171" stroke-opacity="0.55"/><text x="200.0" y="248.3" font-size="12" fill="#fca5a5">lint · R001 · exit 4</text>
    <circle cx="34" cy="244" r="5" fill="#f87171"/>
    <rect x="14" y="270" width="372" height="32" rx="6" fill="#0b1120" stroke="#fbbf24" stroke-opacity="0.55"/><text x="200.0" y="290.3" font-size="12" fill="#fcd34d">diff --tools-only · exit 5</text>
    <circle cx="34" cy="286" r="5" fill="#fbbf24"/>
    <text x="200" y="326" font-size="10" fill="#64748b">lint had nothing to say about callback_url</text>
  </g>
</svg>
