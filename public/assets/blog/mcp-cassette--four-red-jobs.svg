<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="A CI matrix with four failing POSIX jobs and one passing Windows job, and a proxy blocked waiting on a child process that is still alive">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#f8fafc" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="middle">
    <text x="60" y="44" font-size="10" fill="#64748b" text-anchor="start">first CI run, ever</text>
    <rect x="60" y="56" width="420" height="34" rx="8" fill="#1e293b" stroke="#f87171" stroke-opacity="0.45"/>
    <circle cx="84" cy="73" r="10" fill="#0b1120" stroke="#f87171" stroke-width="1.5"/>
    <path d="M80 69 l8 8 M88 69 l-8 8" stroke="#f87171" stroke-width="2" stroke-linecap="round"/>
    <text x="108" y="77" font-size="11" fill="#e2e8f0" text-anchor="start">ubuntu · 3.12</text>
    <text x="462" y="77" font-size="10" fill="#f87171" text-anchor="end">failed</text>
    <rect x="60" y="100" width="420" height="34" rx="8" fill="#1e293b" stroke="#f87171" stroke-opacity="0.45"/>
    <circle cx="84" cy="117" r="10" fill="#0b1120" stroke="#f87171" stroke-width="1.5"/>
    <path d="M80 113 l8 8 M88 113 l-8 8" stroke="#f87171" stroke-width="2" stroke-linecap="round"/>
    <text x="108" y="121" font-size="11" fill="#e2e8f0" text-anchor="start">ubuntu · 3.13</text>
    <text x="462" y="121" font-size="10" fill="#f87171" text-anchor="end">failed</text>
    <rect x="60" y="144" width="420" height="34" rx="8" fill="#1e293b" stroke="#f87171" stroke-opacity="0.45"/>
    <circle cx="84" cy="161" r="10" fill="#0b1120" stroke="#f87171" stroke-width="1.5"/>
    <path d="M80 157 l8 8 M88 157 l-8 8" stroke="#f87171" stroke-width="2" stroke-linecap="round"/>
    <text x="108" y="165" font-size="11" fill="#e2e8f0" text-anchor="start">macos · 3.12</text>
    <text x="462" y="165" font-size="10" fill="#f87171" text-anchor="end">failed</text>
    <rect x="60" y="188" width="420" height="34" rx="8" fill="#1e293b" stroke="#f87171" stroke-opacity="0.45"/>
    <circle cx="84" cy="205" r="10" fill="#0b1120" stroke="#f87171" stroke-width="1.5"/>
    <path d="M80 201 l8 8 M88 201 l-8 8" stroke="#f87171" stroke-width="2" stroke-linecap="round"/>
    <text x="108" y="209" font-size="11" fill="#e2e8f0" text-anchor="start">macos · 3.13</text>
    <text x="462" y="209" font-size="10" fill="#f87171" text-anchor="end">failed</text>
    <rect x="60" y="232" width="420" height="34" rx="8" fill="#1e293b" stroke="#4ade80" stroke-opacity="0.45"/>
    <circle cx="84" cy="249" r="10" fill="#0b1120" stroke="#4ade80" stroke-width="1.5"/>
    <path d="M79 249 l3.5 3.5 l6.5 -7" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="108" y="253" font-size="11" fill="#e2e8f0" text-anchor="start">windows</text>
    <text x="462" y="253" font-size="10" fill="#4ade80" text-anchor="end">passed</text>
    <rect x="600" y="100" width="170" height="40" rx="6" fill="#0b1120" stroke="#475569" stroke-opacity="0.55"/><text x="685.0" y="124.3" font-size="12" fill="#e2e8f0">proxy</text>
    <rect x="930" y="100" width="170" height="40" rx="6" fill="#0b1120" stroke="#4ade80" stroke-opacity="0.55"/><text x="1015.0" y="124.3" font-size="12" fill="#86efac">child</text>
    <line x1="776" y1="120" x2="924" y2="120" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="850" y="110" font-size="10" fill="#4ade80">still alive</text>
    <path d="M700 40 l-18 26 h14 l-12 28" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="712" y="52" font-size="10" fill="#fbbf24" text-anchor="start">SIGTERM hits only the proxy</text>
    <rect x="600" y="176" width="500" height="34" rx="6" fill="#0b1120" stroke="#f87171" stroke-opacity="0.55"/><text x="850.0" y="197.3" font-size="12" fill="#fca5a5">process.wait()  ...forever</text>
    <text x="850" y="244" font-size="11" fill="#94a3b8">the blunt Windows path already did it right</text>
  </g>
</svg>
