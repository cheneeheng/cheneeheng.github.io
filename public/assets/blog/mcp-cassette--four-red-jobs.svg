<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="A CI matrix with four failing POSIX jobs and one passing Windows job, and a proxy blocked waiting on a child process that is still alive">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#f8fafc" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="middle">

    <!-- 1: the matrix -->
    <g transform="translate(90 70)">
      <rect width="300" height="160" rx="16" fill="#1e293b" stroke="#334155"/>
      <g font-size="9" text-anchor="start">
        <g transform="translate(28 34)"><rect width="112" height="20" rx="4" fill="#0b1120" stroke="#f87171" stroke-opacity="0.6"/><text x="10" y="14" fill="#fca5a5">ubuntu 3.12</text></g>
        <g transform="translate(160 34)"><rect width="112" height="20" rx="4" fill="#0b1120" stroke="#f87171" stroke-opacity="0.6"/><text x="10" y="14" fill="#fca5a5">ubuntu 3.13</text></g>
        <g transform="translate(28 60)"><rect width="112" height="20" rx="4" fill="#0b1120" stroke="#f87171" stroke-opacity="0.6"/><text x="10" y="14" fill="#fca5a5">macos 3.12</text></g>
        <g transform="translate(160 60)"><rect width="112" height="20" rx="4" fill="#0b1120" stroke="#f87171" stroke-opacity="0.6"/><text x="10" y="14" fill="#fca5a5">macos 3.13</text></g>
        <g transform="translate(94 86)"><rect width="112" height="20" rx="4" fill="#0b1120" stroke="#4ade80" stroke-opacity="0.6"/><text x="10" y="14" fill="#86efac">windows</text></g>
      </g>
      <text x="150" y="130" font-size="10" fill="#64748b">first run, ever</text>
      <text x="150" y="150">four red, one green</text>
    </g>

    <!-- 2: blocked on a live child -->
    <g transform="translate(450 70)">
      <rect width="300" height="160" rx="16" fill="#1e293b" stroke="#334155"/>
      <g font-size="10">
        <rect x="34" y="42" width="90" height="34" rx="7" fill="#0b1120" stroke="#475569"/>
        <text x="79" y="63" fill="#94a3b8">proxy</text>
        <rect x="176" y="42" width="90" height="34" rx="7" fill="#0b1120" stroke="#4ade80" stroke-opacity="0.5"/>
        <text x="221" y="63" fill="#86efac">child</text>
      </g>
      <path d="M128 59 h44" stroke="#f87171" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/>
      <text x="150" y="100" font-size="10" fill="#f87171">SIGTERM hits only the proxy</text>
      <text x="150" y="148">process.wait() forever</text>
    </g>

    <!-- 3: the fix already existed -->
    <g transform="translate(810 70)">
      <rect width="300" height="160" rx="16" fill="#1e293b" stroke="#334155"/>
      <g font-size="10" fill="#94a3b8">
        <g transform="translate(38 42)"><rect width="224" height="22" rx="5" fill="#0b1120" stroke="#38bdf8" stroke-opacity="0.5"/><text x="112" y="15" fill="#7dd3fc">terminate the child</text></g>
        <g transform="translate(38 72)"><rect width="224" height="22" rx="5" fill="#0b1120" stroke="#38bdf8" stroke-opacity="0.5"/><text x="112" y="15" fill="#7dd3fc">key exit off _signal_received</text></g>
      </g>
      <text x="150" y="118" font-size="10" fill="#64748b">what windows already did</text>
      <text x="150" y="150">the blunt path was right</text>
    </g>

  </g>
</svg>
