    <text x="490" y="178" font-size="10" fill="#94a3b8">pytest</text>
    <circle cx="620" cy="200" r="13" fill="#0b1120" stroke="#4ade80" stroke-width="2"/><path d="M615 200 l3.5 3.5 l6.5 -7" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
