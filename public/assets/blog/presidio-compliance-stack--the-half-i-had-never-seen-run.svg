    <rect x="60" y="176" width="200" height="48" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="160" y="197" font-size="12" fill="#e2e8f0">ubuntu-latest</text>
    <text x="160" y="214" font-size="10" fill="#64748b">O_APPEND</text>
