<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="The audit store&#x27;s two append paths, Windows and POSIX, both running green in CI on the way to a PyPI release">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#f8fafc" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="middle">
    <g transform="translate(56 70)">
      <rect width="300" height="160" rx="16" fill="#1e293b" stroke="#334155"/>
      <g transform="translate(30 34)"><rect width="240" height="24" rx="6" fill="#0b1120" stroke="#4ade80" stroke-opacity="0.5"/><text x="120" y="16" font-size="10" fill="#86efac">CreateFileW</text></g>
      <g transform="translate(30 66)"><rect width="240" height="24" rx="6" fill="#0b1120" stroke="#4ade80" stroke-opacity="0.5"/><text x="120" y="16" font-size="10" fill="#86efac">FILE_APPEND_DATA</text></g>
      <text x="150" y="124" font-size="10" fill="#64748b">windows-latest</text>
      <text x="150" y="148">measured, then fixed</text>
    </g>
    <g transform="translate(450 70)">
      <rect width="300" height="160" rx="16" fill="#1e293b" stroke="#334155"/>
      <g transform="translate(30 34)"><rect width="240" height="24" rx="6" fill="#0b1120" stroke="#fb923c" stroke-opacity="0.5"/><text x="120" y="16" font-size="10" fill="#fdba74">O_APPEND</text></g>
      <g transform="translate(30 66)"><rect width="240" height="24" rx="6" fill="#0b1120" stroke="#fb923c" stroke-opacity="0.5"/><text x="120" y="16" font-size="10" fill="#fdba74">never run anywhere</text></g>
      <text x="150" y="124" font-size="10" fill="#64748b">ubuntu-latest</text>
      <text x="150" y="148">assumed safe, now tested</text>
    </g>
    <g transform="translate(844 70)">
      <rect width="300" height="160" rx="16" fill="#1e293b" stroke="#334155"/>
      <g transform="translate(30 34)"><rect width="240" height="24" rx="6" fill="#0b1120" stroke="#60a5fa" stroke-opacity="0.5"/><text x="120" y="16" font-size="10" fill="#93c5fd">presidio-audit 1.0.0</text></g>
      <g transform="translate(30 66)"><rect width="240" height="24" rx="6" fill="#0b1120" stroke="#60a5fa" stroke-opacity="0.5"/><text x="120" y="16" font-size="10" fill="#93c5fd">presidio-malaysia 1.0.0</text></g>
      <text x="150" y="124" font-size="10" fill="#64748b">pypi · 22 august</text>
      <text x="150" y="148">and then, mostly quiet</text>
    </g>
    <g transform="translate(370 130)">
      <path d="M0 20 h40" stroke="#f472b6" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M40 20 l-12 -6 l0 12 z" fill="#f472b6"/>
      <text x="20" y="8" font-size="9" fill="#f472b6">ci</text>
    </g>
    <g transform="translate(764 130)">
      <path d="M0 20 h40" stroke="#f472b6" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M40 20 l-12 -6 l0 12 z" fill="#f472b6"/>
      <text x="20" y="8" font-size="9" fill="#f472b6">release</text>
    </g>
  </g>
</svg>
