<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" role="img" aria-label="A hash-chained audit log where every link verifies green while one record's recognizer label points at a detection that was discarded">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1F1D"/>
      <stop offset="1" stop-color="#122A27"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#f8fafc" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="400" height="340" fill="url(#bg)"/>
  <rect width="400" height="340" fill="url(#dots)"/>
  <rect width="400" height="340" fill="url(#glow)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="middle">
    <rect x="134" y="54" width="12" height="26" rx="6" fill="none" stroke="#4ade80" stroke-width="2.5"/>
    <rect x="134" y="114" width="12" height="26" rx="6" fill="none" stroke="#4ade80" stroke-width="2.5"/>
    <rect x="134" y="174" width="12" height="26" rx="6" fill="none" stroke="#4ade80" stroke-width="2.5"/>
    <rect x="20" y="16" width="220" height="44" rx="10" fill="#163230" stroke="#203F3A"/>
    <text x="32" y="32" font-size="10" fill="#6E8782" text-anchor="start">record 41</text>
    <text x="130" y="50" font-size="11" fill="#f9a8d4">entity · span</text>
    <path d="M217 36 l3.5 3.5 l6.5 -7" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="20" y="76" width="220" height="44" rx="10" fill="#163230" stroke="#203F3A"/>
    <text x="32" y="92" font-size="10" fill="#6E8782" text-anchor="start">record 42</text>
    <text x="130" y="110" font-size="11" fill="#f9a8d4">entity · span</text>
    <path d="M217 96 l3.5 3.5 l6.5 -7" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="20" y="136" width="220" height="44" rx="10" fill="#163230" stroke="#fbbf24"/>
    <text x="32" y="152" font-size="10" fill="#6E8782" text-anchor="start">record 43</text>
    <text x="130" y="170" font-size="11" fill="#fcd34d">recognizer: MY_PHONE</text>
    <path d="M217 156 l3.5 3.5 l6.5 -7" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="20" y="196" width="220" height="44" rx="10" fill="#163230" stroke="#203F3A"/>
    <text x="32" y="212" font-size="10" fill="#6E8782" text-anchor="start">record 44</text>
    <text x="130" y="230" font-size="11" fill="#f9a8d4">entity · span</text>
    <path d="M217 216 l3.5 3.5 l6.5 -7" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="386" y="34" font-size="12" fill="#4ade80" text-anchor="end">verify_chain: OK</text>
    <path d="M240 158 H 262 V 196" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="254" y="196" width="134" height="72" rx="10" fill="#0C1F1D" stroke="#2D544D" stroke-dasharray="4 4"/>
    <text x="321" y="220" font-size="11" fill="#6E8782">MY_PHONE · 0.85</text>
    <line x1="268" y1="216" x2="374" y2="216" stroke="#f87171" stroke-width="1.5"/>
    <text x="321" y="242" font-size="10" fill="#f87171">dropped at</text>
    <text x="321" y="256" font-size="10" fill="#f87171">join_results</text>
    <text x="200" y="306" font-size="12" fill="#7C9590">the chain verifies,</text>
    <text x="200" y="324" font-size="12" fill="#f472b6">the record is wrong</text>
  </g>
</svg>
