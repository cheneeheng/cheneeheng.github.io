<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="A grid of two-digit NRIC place-of-birth codes from 01 to 99, with the published ones lit and nine gaps inside the foreign-country range">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#f8fafc" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="middle">
    <g transform="translate(56 70)">
      <rect width="300" height="160" rx="16" fill="#1e293b" stroke="#334155"/>
      <g transform="translate(30 34)"><rect width="240" height="24" rx="6" fill="#0b1120" stroke="#4ade80" stroke-opacity="0.5"/><text x="120" y="16" font-size="10" fill="#86efac">01-16 · 21-59 · 82</text></g>
      <g transform="translate(30 66)"><rect width="240" height="24" rx="6" fill="#0b1120" stroke="#475569" stroke-opacity="0.5"/><text x="120" y="16" font-size="10" fill="#94a3b8">state-code table</text></g>
      <text x="150" y="124" font-size="10" fill="#64748b">JPN states</text>
      <text x="150" y="148">17 records</text>
    </g>
    <g transform="translate(450 70)">
      <rect width="300" height="160" rx="16" fill="#1e293b" stroke="#334155"/>
      <g transform="translate(30 34)"><rect width="240" height="24" rx="6" fill="#0b1120" stroke="#4ade80" stroke-opacity="0.5"/><text x="120" y="16" font-size="10" fill="#86efac">60-68 · 71/72 · 74-79</text></g>
      <g transform="translate(30 66)"><rect width="240" height="24" rx="6" fill="#0b1120" stroke="#4ade80" stroke-opacity="0.5"/><text x="120" y="16" font-size="10" fill="#86efac">83-93 · 98 · 99</text></g>
      <text x="150" y="124" font-size="10" fill="#64748b">JPN countries</text>
      <text x="150" y="148">294 rows, 30 codes</text>
    </g>
    <g transform="translate(844 70)">
      <rect width="300" height="160" rx="16" fill="#1e293b" stroke="#334155"/>
      <g transform="translate(30 34)"><rect width="240" height="24" rx="6" fill="#0b1120" stroke="#f87171" stroke-opacity="0.5"/><text x="120" y="16" font-size="10" fill="#fca5a5">69 70 73 80 81</text></g>
      <g transform="translate(30 66)"><rect width="240" height="24" rx="6" fill="#0b1120" stroke="#f87171" stroke-opacity="0.5"/><text x="120" y="16" font-size="10" fill="#fca5a5">94 95 96 97</text></g>
      <text x="150" y="124" font-size="10" fill="#64748b">published nowhere</text>
      <text x="150" y="148">95 codes became 86</text>
    </g>
    <g transform="translate(370 130)">
      <path d="M0 20 h40" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M40 20 l-12 -6 l0 12 z" fill="#60a5fa"/>
      <text x="20" y="8" font-size="9" fill="#60a5fa">sample</text>
    </g>
    <g transform="translate(764 130)">
      <path d="M0 20 h40" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M40 20 l-12 -6 l0 12 z" fill="#60a5fa"/>
      <text x="20" y="8" font-size="9" fill="#60a5fa">all rows</text>
    </g>
  </g>
</svg>
