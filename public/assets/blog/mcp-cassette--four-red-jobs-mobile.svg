<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" role="img" aria-label="A CI matrix with four failing POSIX jobs and one passing Windows job, and a proxy blocked waiting on a child process that is still alive">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#f8fafc" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="400" height="340" fill="url(#bg)"/>
  <rect width="400" height="340" fill="url(#dots)"/>
  <rect width="400" height="340" fill="url(#glow)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="middle">
    <text x="14" y="18" font-size="10" fill="#64748b" text-anchor="start">first CI run, ever</text>
    <rect x="14" y="26" width="372" height="28" rx="7" fill="#1e293b" stroke="#f87171" stroke-opacity="0.45"/>
    <circle cx="34" cy="40" r="9" fill="#0b1120" stroke="#f87171" stroke-width="1.5"/>
    <path d="M30 36 l8 8 M38 36 l-8 8" stroke="#f87171" stroke-width="2" stroke-linecap="round"/>
    <text x="54" y="44" font-size="12" fill="#e2e8f0" text-anchor="start">ubuntu · 3.12</text>
    <text x="372" y="44" font-size="11" fill="#f87171" text-anchor="end">failed</text>
    <rect x="14" y="60" width="372" height="28" rx="7" fill="#1e293b" stroke="#f87171" stroke-opacity="0.45"/>
    <circle cx="34" cy="74" r="9" fill="#0b1120" stroke="#f87171" stroke-width="1.5"/>
    <path d="M30 70 l8 8 M38 70 l-8 8" stroke="#f87171" stroke-width="2" stroke-linecap="round"/>
    <text x="54" y="78" font-size="12" fill="#e2e8f0" text-anchor="start">ubuntu · 3.13</text>
    <text x="372" y="78" font-size="11" fill="#f87171" text-anchor="end">failed</text>
    <rect x="14" y="94" width="372" height="28" rx="7" fill="#1e293b" stroke="#f87171" stroke-opacity="0.45"/>
    <circle cx="34" cy="108" r="9" fill="#0b1120" stroke="#f87171" stroke-width="1.5"/>
    <path d="M30 104 l8 8 M38 104 l-8 8" stroke="#f87171" stroke-width="2" stroke-linecap="round"/>
    <text x="54" y="112" font-size="12" fill="#e2e8f0" text-anchor="start">macos · 3.12</text>
    <text x="372" y="112" font-size="11" fill="#f87171" text-anchor="end">failed</text>
    <rect x="14" y="128" width="372" height="28" rx="7" fill="#1e293b" stroke="#f87171" stroke-opacity="0.45"/>
    <circle cx="34" cy="142" r="9" fill="#0b1120" stroke="#f87171" stroke-width="1.5"/>
    <path d="M30 138 l8 8 M38 138 l-8 8" stroke="#f87171" stroke-width="2" stroke-linecap="round"/>
    <text x="54" y="146" font-size="12" fill="#e2e8f0" text-anchor="start">macos · 3.13</text>
    <text x="372" y="146" font-size="11" fill="#f87171" text-anchor="end">failed</text>
    <rect x="14" y="162" width="372" height="28" rx="7" fill="#1e293b" stroke="#4ade80" stroke-opacity="0.45"/>
    <circle cx="34" cy="176" r="9" fill="#0b1120" stroke="#4ade80" stroke-width="1.5"/>
    <path d="M29 176 l3.5 3.5 l6.5 -7" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="54" y="180" font-size="12" fill="#e2e8f0" text-anchor="start">windows</text>
    <text x="372" y="180" font-size="11" fill="#4ade80" text-anchor="end">passed</text>
    <path d="M82 200 l-12 18 h10 l-8 18" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="100" y="214" font-size="11" fill="#fbbf24" text-anchor="start">SIGTERM hits only the proxy</text>
    <rect x="14" y="238" width="130" height="30" rx="6" fill="#0b1120" stroke="#475569" stroke-opacity="0.55"/><text x="79.0" y="257.3" font-size="12" fill="#e2e8f0">proxy</text>
    <rect x="256" y="238" width="130" height="30" rx="6" fill="#0b1120" stroke="#4ade80" stroke-opacity="0.55"/><text x="321.0" y="257.3" font-size="12" fill="#86efac">child</text>
    <line x1="148" y1="253" x2="252" y2="253" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="200" y="246" font-size="10" fill="#4ade80">still alive</text>
    <rect x="14" y="280" width="372" height="28" rx="6" fill="#0b1120" stroke="#f87171" stroke-opacity="0.55"/><text x="200.0" y="298.3" font-size="12" fill="#fca5a5">process.wait()  ...forever</text>
    <text x="200" y="330" font-size="11" fill="#94a3b8">the blunt Windows path did it right</text>
  </g>
</svg>
