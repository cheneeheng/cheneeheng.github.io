<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" role="img" aria-label="A model's judgement feeding the monitor on the left, and a fixed policy table gating the remediation on the right">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#f8fafc" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="400" height="340" fill="url(#bg)"/>
  <rect width="400" height="340" fill="url(#dots)"/>
  <rect width="400" height="340" fill="url(#glow)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="middle">
    <rect x="20" y="20" width="360" height="70" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-opacity="0.6"/>
    <text x="200" y="46" font-size="13" fill="#fcd34d">monitor · haiku</text>
    <text x="200" y="68" font-size="11" fill="#94a3b8">no thresholds · open_incident?</text>
    <path d="M200 90 V 108" stroke="#475569" stroke-width="2"/>
    <rect x="20" y="108" width="360" height="44" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="200" y="135" font-size="12" fill="#e2e8f0">diagnosis · <tspan fill="#fcd34d">confidence 0.87</tspan></text>
    <path d="M200 152 V 170" stroke="#475569" stroke-width="2"/>
    <rect x="20" y="170" width="360" height="150" rx="12" fill="#1e293b" stroke="#475569"/>
    <text x="200" y="194" font-size="12" fill="#e2e8f0">policy.py</text>
    <g font-size="11" text-anchor="start">
      <text x="40" y="220" fill="#94a3b8">bad_deploy</text><text x="180" y="220" fill="#cbd5e1">rollback</text><text x="310" y="220" fill="#4ade80">low</text>
      <text x="40" y="242" fill="#94a3b8">feature_drift</text><text x="180" y="242" fill="#cbd5e1">retrain</text><text x="310" y="242" fill="#fbbf24">med</text>
      <text x="40" y="264" fill="#94a3b8">skew, latency</text><text x="180" y="264" fill="#cbd5e1">pipeline_fix</text><text x="310" y="264" fill="#fbbf24">med</text>
      <text x="40" y="286" fill="#94a3b8">unknown</text><text x="180" y="286" fill="#cbd5e1">pipeline_fix</text><text x="310" y="286" fill="#f87171">high</text>
    </g>
    <text x="200" y="310" font-size="10" fill="#86efac">auto only if low and ≥ 0.85</text>
  </g>
</svg>
