<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" role="img" aria-label="A balance weighing a Malaysian recognizer pack against an audit layer that records what was redacted, from where, and when, tipped toward the audit layer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1F1D"/>
      <stop offset="1" stop-color="#122A27"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#f8fafc" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="400" height="340" fill="url(#bg)"/>
  <rect width="400" height="340" fill="url(#dots)"/>
  <rect width="400" height="340" fill="url(#glow)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="middle">
    <rect x="160" y="318" width="80" height="10" rx="4" fill="#163230" stroke="#203F3A"/>
    <rect x="196" y="70" width="8" height="250" fill="#203F3A"/>
    <line x1="60" y1="58" x2="30" y2="96" stroke="#2D544D" stroke-width="1.5"/>
    <line x1="60" y1="58" x2="170" y2="96" stroke="#2D544D" stroke-width="1.5"/>
    <line x1="340" y1="82" x2="230" y2="120" stroke="#2D544D" stroke-width="1.5"/>
    <line x1="340" y1="82" x2="370" y2="120" stroke="#2D544D" stroke-width="1.5"/>
    <line x1="60" y1="58" x2="340" y2="82" stroke="#2D544D" stroke-width="6" stroke-linecap="round"/>
    <circle cx="200" cy="70" r="9" fill="#0C1F1D" stroke="#f472b6" stroke-width="3"/>
    <rect x="14" y="96" width="172" height="166" rx="14" fill="#163230" stroke="#203F3A"/>
    <text x="100" y="116" font-size="11" fill="#6E8782">recognizer pack</text>
    <rect x="26" y="126" width="148" height="20" rx="6" fill="#0C1F1D" stroke="#2D544D" stroke-opacity="0.55"/><text x="100.0" y="140.0" font-size="11" fill="#E7F1EE">MY_NRIC</text>
    <rect x="26" y="150" width="148" height="20" rx="6" fill="#0C1F1D" stroke="#2D544D" stroke-opacity="0.55"/><text x="100.0" y="164.0" font-size="11" fill="#E7F1EE">MY_SSM</text>
    <rect x="26" y="174" width="148" height="20" rx="6" fill="#0C1F1D" stroke="#2D544D" stroke-opacity="0.55"/><text x="100.0" y="188.0" font-size="11" fill="#E7F1EE">MY_PHONE</text>
    <rect x="26" y="198" width="148" height="20" rx="6" fill="#0C1F1D" stroke="#2D544D" stroke-opacity="0.55"/><text x="100.0" y="212.0" font-size="11" fill="#E7F1EE">MY_POSTCODE</text>
    <text x="100" y="236" font-size="11" fill="#7C9590">same shape,</text>
    <text x="100" y="252" font-size="11" fill="#7C9590">new regexes</text>
    <rect x="214" y="120" width="172" height="166" rx="14" fill="#163230" stroke="#f472b6" stroke-opacity="0.6"/>
    <text x="300" y="140" font-size="11" fill="#6E8782">audit layer</text>
    <rect x="226" y="150" width="148" height="20" rx="6" fill="#0C1F1D" stroke="#f472b6" stroke-opacity="0.55"/><text x="300.0" y="164.0" font-size="11" fill="#f9a8d4">what was redacted</text>
    <rect x="226" y="174" width="148" height="20" rx="6" fill="#0C1F1D" stroke="#f472b6" stroke-opacity="0.55"/><text x="300.0" y="188.0" font-size="11" fill="#f9a8d4">from where</text>
    <rect x="226" y="198" width="148" height="20" rx="6" fill="#0C1F1D" stroke="#f472b6" stroke-opacity="0.55"/><text x="300.0" y="212.0" font-size="11" fill="#f9a8d4">when</text>
    <text x="300" y="252" font-size="11" fill="#f472b6">nobody kept</text>
    <text x="300" y="268" font-size="11" fill="#f472b6">a record</text>
  </g>
</svg>
