<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" role="img" aria-label="A recording proxy in front of a remote MCP server, with a server-initiated sampling request going to a stream that has no listener">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#f8fafc" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="400" height="340" fill="url(#bg)"/>
  <rect width="400" height="340" fill="url(#dots)"/>
  <rect width="400" height="340" fill="url(#glow)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="middle">
    <rect x="12" y="12" width="116" height="28" rx="6" fill="#0b1120" stroke="#475569" stroke-opacity="0.55"/><text x="70.0" y="29.6" font-size="10" fill="#e2e8f0">agent</text>
    <line x1="70" y1="44" x2="70" y2="300" stroke="#334155" stroke-width="2" stroke-dasharray="4 6"/>
    <rect x="142" y="12" width="116" height="28" rx="6" fill="#0b1120" stroke="#475569" stroke-opacity="0.55"/><text x="200.0" y="29.6" font-size="10" fill="#e2e8f0">proxy · recording</text>
    <line x1="200" y1="44" x2="200" y2="300" stroke="#334155" stroke-width="2" stroke-dasharray="4 6"/>
    <rect x="272" y="12" width="116" height="28" rx="6" fill="#0b1120" stroke="#475569" stroke-opacity="0.55"/><text x="330.0" y="29.6" font-size="10" fill="#e2e8f0">server</text>
    <line x1="330" y1="44" x2="330" y2="300" stroke="#334155" stroke-width="2" stroke-dasharray="4 6"/>
    <line x1="70" y1="84" x2="188.0" y2="84.0" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/><path d="M196 84 L186.0 79.0 L186.0 89.0 z" fill="#38bdf8"/>
    <text x="135" y="76" font-size="10" fill="#7dd3fc">POST tools/call</text>
    <line x1="200" y1="84" x2="318.0" y2="84.0" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/><path d="M326 84 L316.0 79.0 L316.0 89.0 z" fill="#38bdf8"/>
    <text x="265" y="76" font-size="10" fill="#7dd3fc">POST · SSE</text>
    <rect x="210" y="112" width="110" height="40" rx="8" fill="#0b1120" stroke="#475569" stroke-dasharray="4 4"/>
    <text x="265" y="129" font-size="10" fill="#94a3b8">GET stream</text>
    <text x="265" y="144" font-size="10" fill="#64748b">no listener</text>
    <line x1="330" y1="192" x2="222.0" y2="192.0" stroke="#f87171" stroke-width="2" stroke-linecap="round"/><path d="M214 192 L224.0 197.0 L224.0 187.0 z" fill="#f87171"/>
    <text x="272" y="184" font-size="11" fill="#fca5a5">create_message</text>
    <path d="M202 188 l8 8 M210 188 l-8 8" stroke="#f87171" stroke-width="2" stroke-linecap="round"/>
    <text x="290" y="216" font-size="10" fill="#f87171">no related_request_id</text>
    <text x="290" y="230" font-size="10" fill="#f87171">-> nobody home</text>
    <path d="M70 100 V 280" stroke="#fbbf24" stroke-width="3" stroke-opacity="0.6"/>
    <text x="84" y="300" font-size="11" fill="#fbbf24" text-anchor="start">the recording</text>
    <text x="84" y="316" font-size="11" fill="#fbbf24" text-anchor="start">just hung</text>
  </g>
</svg>
