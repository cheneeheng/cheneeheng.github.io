<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="A proxy stalled mid-stream on a buffered read, then shutting down by terminating its child and exiting with code 130">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#f8fafc" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="middle">

    <!-- 1: buffered read stalls -->
    <g transform="translate(90 70)">
      <rect width="300" height="160" rx="16" fill="#1e293b" stroke="#334155"/>
      <rect x="40" y="48" width="220" height="26" rx="6" fill="#0b1120" stroke="#475569"/>
      <rect x="44" y="52" width="58" height="18" rx="4" fill="#38bdf8" fill-opacity="0.35"/>
      <text x="150" y="94" font-size="10" fill="#f87171">read(n) waits for n bytes</text>
      <g stroke="#f87171" stroke-width="2" stroke-linecap="round" opacity="0.8">
        <line x1="132" y1="110" x2="132" y2="122"/>
        <line x1="150" y1="110" x2="150" y2="122"/>
        <line x1="168" y1="110" x2="168" y2="122"/>
      </g>
      <text x="150" y="148">one short line, then nothing</text>
    </g>

    <!-- 2: argparse swallows the flags -->
    <g transform="translate(450 70)">
      <rect width="300" height="160" rx="16" fill="#1e293b" stroke="#334155"/>
      <g font-size="10">
        <g transform="translate(30 48)"><rect width="240" height="24" rx="5" fill="#0b1120" stroke="#475569"/><text x="14" y="16" fill="#94a3b8" text-anchor="start">serve demo.json --faults f.json</text></g>
        <g transform="translate(30 84)"><rect width="240" height="24" rx="5" fill="#0b1120" stroke="#475569"/><text x="14" y="16" fill="#64748b" text-anchor="start">REMAINDER: [--faults, f.json]</text></g>
      </g>
      <text x="150" y="148">split argv on the first --</text>
    </g>

    <!-- 3: the blunt exit -->
    <g transform="translate(810 70)">
      <rect width="300" height="160" rx="16" fill="#1e293b" stroke="#334155"/>
      <g font-size="10" fill="#94a3b8">
        <g transform="translate(40 40)"><rect width="220" height="20" rx="5" fill="#0b1120" stroke="#475569"/><text x="110" y="14">terminate child</text></g>
        <g transform="translate(40 66)"><rect width="220" height="20" rx="5" fill="#0b1120" stroke="#38bdf8" stroke-opacity="0.5"/><text x="110" y="14" fill="#7dd3fc">_finalize() writes cassette</text></g>
        <g transform="translate(40 92)"><rect width="220" height="20" rx="5" fill="#0b1120" stroke="#f87171" stroke-opacity="0.5"/><text x="110" y="14" fill="#fca5a5">os._exit(130)</text></g>
      </g>
      <text x="150" y="148">blunt, but the file is safe</text>
    </g>

  </g>
</svg>
