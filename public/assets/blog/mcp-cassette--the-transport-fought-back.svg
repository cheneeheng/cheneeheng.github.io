<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="A proxy stalled mid-stream on a buffered read, an argument parser swallowing flags after the first positional, and a shutdown that terminates its child and exits with code 130">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#f8fafc" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="middle">
    <text x="60" y="86" font-size="11" fill="#64748b" text-anchor="start">stdin</text>
    <text x="60" y="170" font-size="11" fill="#64748b" text-anchor="start">argv</text>
    <text x="60" y="250" font-size="11" fill="#64748b" text-anchor="start">exit</text>
    <rect x="140" y="66" width="1000" height="32" rx="8" fill="#0b1120" stroke="#334155"/>
    <rect x="150" y="74" width="14" height="16" rx="3" fill="#38bdf8" fill-opacity="0.55"/>
    <rect x="168" y="74" width="14" height="16" rx="3" fill="#38bdf8" fill-opacity="0.55"/>
    <rect x="186" y="74" width="14" height="16" rx="3" fill="#38bdf8" fill-opacity="0.55"/>
    <rect x="204" y="74" width="14" height="16" rx="3" fill="#38bdf8" fill-opacity="0.55"/>
    <rect x="222" y="74" width="14" height="16" rx="3" fill="#38bdf8" fill-opacity="0.55"/>
    <rect x="240" y="74" width="14" height="16" rx="3" fill="#38bdf8" fill-opacity="0.55"/>
    <rect x="258" y="74" width="14" height="16" rx="3" fill="#38bdf8" fill-opacity="0.55"/>
    <rect x="276" y="74" width="14" height="16" rx="3" fill="#38bdf8" fill-opacity="0.55"/>
    <rect x="294" y="74" width="14" height="16" rx="3" fill="#38bdf8" fill-opacity="0.55"/>
    <rect x="312" y="74" width="14" height="16" rx="3" fill="#38bdf8" fill-opacity="0.55"/>
    <rect x="330" y="74" width="14" height="16" rx="3" fill="#38bdf8" fill-opacity="0.55"/>
    <rect x="348" y="74" width="14" height="16" rx="3" fill="#38bdf8" fill-opacity="0.55"/>
    <rect x="366" y="74" width="14" height="16" rx="3" fill="#38bdf8" fill-opacity="0.55"/>
    <rect x="384" y="74" width="14" height="16" rx="3" fill="#38bdf8" fill-opacity="0.55"/>
    <rect x="402" y="74" width="14" height="16" rx="3" fill="#38bdf8" fill-opacity="0.55"/>
    <rect x="420" y="74" width="14" height="16" rx="3" fill="#38bdf8" fill-opacity="0.55"/>
    <rect x="438" y="74" width="14" height="16" rx="3" fill="#38bdf8" fill-opacity="0.55"/>
    <rect x="456" y="74" width="14" height="16" rx="3" fill="#38bdf8" fill-opacity="0.55"/>
    <rect x="476" y="72" width="560" height="20" rx="4" fill="none" stroke="#475569" stroke-dasharray="4 4"/>
    <path d="M150 58 V 52 H 1036 V 58" fill="none" stroke="#f87171" stroke-width="1.5"/>
    <text x="593" y="46" font-size="11" fill="#f87171">read(n) waits for n bytes</text>
    <text x="476" y="116" font-size="11" fill="#94a3b8" text-anchor="start">one short line, then nothing</text>
    <rect x="140" y="152" width="80" height="28" rx="6" fill="#0b1120" stroke="#38bdf8" stroke-opacity="0.55"/><text x="180.0" y="170.0" font-size="11" fill="#7dd3fc">serve</text>
    <rect x="232" y="152" width="120" height="28" rx="6" fill="#0b1120" stroke="#38bdf8" stroke-opacity="0.55"/><text x="292.0" y="170.0" font-size="11" fill="#7dd3fc">demo.json</text>
    <rect x="364" y="152" width="110" height="28" rx="6" fill="#0b1120" stroke="#f87171" stroke-opacity="0.55"/><text x="419.0" y="170.0" font-size="11" fill="#fca5a5">--faults</text>
    <rect x="486" y="152" width="90" height="28" rx="6" fill="#0b1120" stroke="#f87171" stroke-opacity="0.55"/><text x="531.0" y="170.0" font-size="11" fill="#fca5a5">f.json</text>
    <path d="M354 186 V 192 H 576 V 186" fill="none" stroke="#f87171" stroke-width="1.5"/>
    <text x="465" y="206" font-size="10" fill="#f87171">REMAINDER swallowed them</text>
    <text x="620" y="170" font-size="11" fill="#94a3b8" text-anchor="start">fix: split argv on the first --</text>
    <rect x="140" y="232" width="170" height="28" rx="6" fill="#0b1120" stroke="#38bdf8" stroke-opacity="0.55"/><text x="225.0" y="250.0" font-size="11" fill="#7dd3fc">terminate child</text>
    <line x1="314" y1="246" x2="332.0" y2="246.0" stroke="#64748b" stroke-width="2" stroke-linecap="round"/><path d="M340 246 L330.0 241.0 L330.0 251.0 z" fill="#64748b"/>
    <rect x="344" y="232" width="250" height="28" rx="6" fill="#0b1120" stroke="#38bdf8" stroke-opacity="0.55"/><text x="469.0" y="250.0" font-size="11" fill="#7dd3fc">_finalize() writes cassette</text>
    <line x1="598" y1="246" x2="616.0" y2="246.0" stroke="#64748b" stroke-width="2" stroke-linecap="round"/><path d="M624 246 L614.0 241.0 L614.0 251.0 z" fill="#64748b"/>
    <rect x="628" y="232" width="160" height="28" rx="6" fill="#0b1120" stroke="#fbbf24" stroke-opacity="0.55"/><text x="708.0" y="250.0" font-size="11" fill="#fcd34d">os._exit(130)</text>
    <text x="806" y="250" font-size="11" fill="#94a3b8" text-anchor="start">blunt, but the file is safe</text>
  </g>
</svg>
