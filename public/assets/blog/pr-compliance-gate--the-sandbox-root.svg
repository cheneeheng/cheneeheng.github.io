<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="A path check correctly guarding everything inside a sandbox whose root is chosen by an untrusted request field">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#f8fafc" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="middle">

    <!-- 1: the request body -->
    <g transform="translate(90 70)">
      <rect width="300" height="160" rx="16" fill="#1e293b" stroke="#334155"/>
      <g transform="translate(40 44)">
        <rect width="220" height="52" rx="8" fill="#0b1120" stroke="#f87171" stroke-opacity="0.5"/>
        <text x="110" y="22" font-size="10" fill="#94a3b8">POST /api/reviews</text>
        <text x="110" y="40" font-size="10" fill="#fca5a5">{ "pr_id": "../.." }</text>
      </g>
      <text x="150" y="122" font-size="10" fill="#64748b">joined, unvalidated</text>
      <text x="150" y="150">the least trusted input</text>
    </g>

    <!-- 2: the guard is fine -->
    <g transform="translate(450 70)">
      <rect width="300" height="160" rx="16" fill="#1e293b" stroke="#334155"/>
      <rect x="44" y="36" width="212" height="72" rx="10" fill="#0b1120" stroke="#4ade80" stroke-opacity="0.5" stroke-dasharray="6 4"/>
      <text x="150" y="60" font-size="10" fill="#86efac">resolve_in_sandbox</text>
      <g font-size="9" fill="#64748b">
        <text x="150" y="80">every path checked</text>
        <text x="150" y="96">every call, correctly</text>
      </g>
      <text x="150" y="148">the guard was never wrong</text>
    </g>

    <!-- 3: the root moves -->
    <g transform="translate(810 70)">
      <rect width="300" height="160" rx="16" fill="#1e293b" stroke="#334155"/>
      <rect x="30" y="40" width="112" height="64" rx="9" fill="#0b1120" stroke="#334155" stroke-dasharray="5 4"/>
      <text x="86" y="76" font-size="9" fill="#475569">intended root</text>
      <rect x="164" y="40" width="112" height="64" rx="9" fill="#0b1120" stroke="#f87171" stroke-opacity="0.6"/>
      <text x="220" y="70" font-size="9" fill="#fca5a5">actual root</text>
      <text x="220" y="86" font-size="9" fill="#64748b">chosen by caller</text>
      <path d="M148 72 h10" stroke="#f87171" stroke-width="2"/>
      <path d="M162 72 l-10 -5 l0 10 z" fill="#f87171"/>
      <text x="150" y="150">the boundary itself moved</text>
    </g>

  </g>
</svg>
