<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="A review pipeline split into a cheap green path and an expensive orange path, with two gates controlling which traffic reaches the expensive one">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#f8fafc" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="middle">
    <rect x="60" y="56" width="300" height="180" rx="14" fill="#4ade80" fill-opacity="0.08" stroke="#4ade80" stroke-opacity="0.45"/>
    <rect x="90" y="100" width="240" height="26" rx="6" fill="#0b1120" stroke="#4ade80" stroke-opacity="0.55"/><text x="210.0" y="117.0" font-size="11" fill="#86efac">classify · haiku</text>
    <rect x="90" y="136" width="240" height="26" rx="6" fill="#0b1120" stroke="#4ade80" stroke-opacity="0.55"/><text x="210.0" y="153.0" font-size="11" fill="#86efac">risk_score · haiku</text>
    <text x="210" y="190" font-size="11" fill="#94a3b8">the cheap path</text>
    <text x="210" y="262" font-size="11" fill="#4ade80">most reviews end here</text>
    <path d="M360 56 L 430 100 V 200 L 360 236 z" fill="#a78bfa" fill-opacity="0.06"/>
    <line x1="430" y1="84" x2="430" y2="216" stroke="#a78bfa" stroke-width="3"/>
    <text x="430" y="76" font-size="10" fill="#a78bfa">gate 1</text>
    <rect x="440" y="100" width="280" height="100" rx="12" fill="#fb923c" fill-opacity="0.08" stroke="#fb923c" stroke-opacity="0.45"/>
    <rect x="456" y="116" width="120" height="24" rx="6" fill="#0b1120" stroke="#fb923c" stroke-opacity="0.55"/><text x="516.0" y="131.6" font-size="10" fill="#fdba74">security</text>
    <rect x="584" y="116" width="120" height="24" rx="6" fill="#0b1120" stroke="#fb923c" stroke-opacity="0.55"/><text x="644.0" y="131.6" font-size="10" fill="#fdba74">license</text>
    <text x="580" y="168" font-size="10" fill="#94a3b8">sonnet</text>
    <text x="580" y="222" font-size="11" fill="#fb923c">where the money goes</text>
    <path d="M720 100 L 790 126 V 174 L 720 200 z" fill="#a78bfa" fill-opacity="0.06"/>
    <line x1="790" y1="112" x2="790" y2="188" stroke="#a78bfa" stroke-width="3"/>
    <text x="790" y="104" font-size="10" fill="#a78bfa">gate 2</text>
    <rect x="800" y="126" width="200" height="48" rx="10" fill="#f87171" fill-opacity="0.08" stroke="#f87171" stroke-opacity="0.45"/>
    <text x="900" y="155" font-size="11" fill="#fca5a5">investigate</text>
    <text x="900" y="196" font-size="10" fill="#64748b">agent sdk</text>
    <line x1="1004" y1="150" x2="1026.0" y2="150.0" stroke="#64748b" stroke-width="2" stroke-linecap="round"/><path d="M1034 150 L1024.0 145.0 L1024.0 155.0 z" fill="#64748b"/>
    <rect x="1040" y="134" width="110" height="32" rx="6" fill="#0b1120" stroke="#a78bfa" stroke-opacity="0.55"/><text x="1095.0" y="154.0" font-size="11" fill="#c4b5fd">human_gate</text>
    <text x="1095" y="120" font-size="10" fill="#94a3b8">a person</text>
    <text x="1095" y="186" font-size="10" fill="#94a3b8">still says yes</text>
  </g>
</svg>
