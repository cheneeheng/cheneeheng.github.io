<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="A review pipeline split into a cheap green path and an expensive orange path, with two gates controlling which traffic reaches the expensive one">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#f8fafc" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="middle">

    <!-- 1: cheap intake -->
    <g transform="translate(60 70)">
      <rect width="280" height="160" rx="16" fill="#1e293b" stroke="#334155"/>
      <g font-size="10">
        <g transform="translate(46 42)"><rect width="188" height="22" rx="5" fill="#0b1120" stroke="#4ade80" stroke-opacity="0.45"/><text x="94" y="15" fill="#86efac">classify · haiku</text></g>
        <g transform="translate(46 72)"><rect width="188" height="22" rx="5" fill="#0b1120" stroke="#4ade80" stroke-opacity="0.45"/><text x="94" y="15" fill="#86efac">risk_score · haiku</text></g>
      </g>
      <text x="140" y="122" font-size="10" fill="#64748b">the cheap path</text>
      <text x="140" y="148">most reviews end here</text>
    </g>

    <!-- gate 1 -->
    <g transform="translate(348 130)">
      <path d="M0 20 h44" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M44 20 l-12 -6 l0 12 z" fill="#a78bfa"/>
      <text x="22" y="8" font-size="9" fill="#c4b5fd">gate 1</text>
    </g>

    <!-- 2: the expensive band -->
    <g transform="translate(404 70)">
      <rect width="300" height="160" rx="16" fill="#1e293b" stroke="#334155"/>
      <g font-size="10">
        <g transform="translate(28 42)"><rect width="112" height="46" rx="7" fill="#0b1120" stroke="#fb923c" stroke-opacity="0.5"/><text x="56" y="20" fill="#fdba74">security</text><text x="56" y="36" fill="#64748b">sonnet</text></g>
        <g transform="translate(160 42)"><rect width="112" height="46" rx="7" fill="#0b1120" stroke="#fb923c" stroke-opacity="0.5"/><text x="56" y="20" fill="#fdba74">license</text><text x="56" y="36" fill="#64748b">sonnet</text></g>
      </g>
      <g transform="translate(64 100)"><rect width="172" height="22" rx="5" fill="#0b1120" stroke="#475569"/><text x="86" y="15" font-size="10" fill="#94a3b8">reconcile · plain python</text></g>
      <text x="150" y="148">where the money goes</text>
    </g>

    <!-- gate 2 -->
    <g transform="translate(712 130)">
      <path d="M0 20 h44" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M44 20 l-12 -6 l0 12 z" fill="#a78bfa"/>
      <text x="22" y="8" font-size="9" fill="#c4b5fd">gate 2</text>
    </g>

    <!-- 3: investigator + human -->
    <g transform="translate(768 70)">
      <rect width="300" height="160" rx="16" fill="#1e293b" stroke="#334155"/>
      <g transform="translate(30 40)"><rect width="240" height="42" rx="7" fill="#0b1120" stroke="#fb923c" stroke-opacity="0.5"/><text x="120" y="18" font-size="10" fill="#fdba74">investigate · agent sdk</text><text x="120" y="33" font-size="9" fill="#64748b">3 read-only tools · hard budgets</text></g>
      <g transform="translate(30 94)"><rect width="240" height="28" rx="7" fill="#0b1120" stroke="#60a5fa" stroke-opacity="0.55"/><text x="120" y="18" font-size="10" fill="#93c5fd">human_gate · interrupt</text></g>
      <text x="150" y="148">a person still says yes</text>
    </g>

  </g>
</svg>
