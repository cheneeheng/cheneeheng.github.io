<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" role="img" aria-label="A stack of audit passes marked compiled and inspected, above a control plane that has finally been switched on">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.7" r="0.7">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#f8fafc" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="400" height="340" fill="url(#bg)"/>
  <rect width="400" height="340" fill="url(#dots)"/>
  <rect width="400" height="340" fill="url(#glow)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="middle">
    <g text-anchor="start" font-size="11">
      <rect x="20" y="16" width="360" height="34" rx="9" fill="#1e293b" stroke="#334155"/>
      <text x="34" y="38" fill="#64748b">24 jul</text><text x="100" y="38" fill="#cbd5e1">agents</text><text x="220" y="38" fill="#fcd34d">compiled</text>
      <rect x="20" y="58" width="360" height="34" rx="9" fill="#1e293b" stroke="#334155"/>
      <text x="34" y="80" fill="#64748b">24 jul</text><text x="100" y="80" fill="#cbd5e1">events</text><text x="220" y="80" fill="#fcd34d">strings compared</text>
      <rect x="20" y="100" width="360" height="34" rx="9" fill="#1e293b" stroke="#334155"/>
      <text x="34" y="122" fill="#64748b">26 aug</text><text x="100" y="122" fill="#cbd5e1">answer key</text><text x="220" y="122" fill="#fcd34d">inspected</text>
      <rect x="20" y="142" width="360" height="34" rx="9" fill="#1e293b" stroke="#334155"/>
      <text x="34" y="164" fill="#64748b">27 aug</text><text x="100" y="164" fill="#cbd5e1">guide</text><text x="220" y="164" fill="#fcd34d">read from source</text>
    </g>
    <path d="M200 176 V 196" stroke="#475569" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>
    <rect x="60" y="196" width="280" height="82" rx="14" fill="#1e293b" stroke="#4ade80" stroke-opacity="0.6"/>
    <text x="200" y="218" font-size="11" fill="#94a3b8">early october</text>
    <circle cx="200" cy="240" r="12" fill="#0b1120" stroke="#4ade80" stroke-width="2"/>
    <path d="M195 240 l3.5 3.5 l6.5 -7" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="200" y="268" font-size="12" fill="#86efac">demos ran · no edits</text>
    <text x="200" y="304" font-size="11" fill="#94a3b8">cli · dashboards · frameworks</text>
    <text x="200" y="324" font-size="11" fill="#64748b">which first?</text>
  </g>
</svg>
