<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="A live agent-to-server session being recorded to a cassette file, then the cassette replayed offline in place of the server">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#f8fafc" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="middle">
    <rect x="60" y="96" width="110" height="32" rx="6" fill="#0b1120" stroke="#475569" stroke-opacity="0.55"/><text x="115.0" y="116.0" font-size="11" fill="#e2e8f0">agent</text>
    <rect x="250" y="96" width="110" height="32" rx="6" fill="#0b1120" stroke="#475569" stroke-opacity="0.55"/><text x="305.0" y="116.0" font-size="11" fill="#e2e8f0">server</text>
    <line x1="176" y1="106" x2="236.0" y2="106.0" stroke="#64748b" stroke-width="2" stroke-linecap="round"/><path d="M244 106 L234.0 101.0 L234.0 111.0 z" fill="#64748b"/>
    <line x1="244" y1="122" x2="184.0" y2="122.0" stroke="#64748b" stroke-width="2" stroke-linecap="round"/><path d="M176 122 L186.0 127.0 L186.0 117.0 z" fill="#64748b"/>
    <circle cx="72" cy="66" r="6" fill="#f87171"/>
    <text x="86" y="70" font-size="11" fill="#f87171" text-anchor="start">REC</text>
    <text x="210" y="160" font-size="10" fill="#64748b">slow · paid · flaky</text>
    <text x="210" y="184" font-size="11" fill="#94a3b8">every run calls the model</text>
    <path d="M210 196 V 214 H 410" fill="none" stroke="#f87171" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="420" y="50" width="360" height="200" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="2"/>
    <rect x="446" y="68" width="308" height="34" rx="6" fill="#0b1120" stroke="#334155"/>
    <text x="600" y="90" font-size="12" fill="#7dd3fc">session.mcp.json</text>
    <rect x="490" y="122" width="220" height="68" rx="12" fill="#0b1120" stroke="#334155"/>
    <path d="M540 182 Q 600 196 660 182" fill="none" stroke="#475569" stroke-width="3"/>
    <circle cx="540" cy="156" r="24" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.7" stroke-width="2"/>
    <circle cx="540" cy="156" r="8" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <line x1="540" y1="148" x2="540" y2="136" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="2" transform="rotate(0 540 156)"/>
    <line x1="540" y1="148" x2="540" y2="136" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="2" transform="rotate(120 540 156)"/>
    <line x1="540" y1="148" x2="540" y2="136" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="2" transform="rotate(240 540 156)"/>
    <circle cx="660" cy="156" r="24" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.7" stroke-width="2"/>
    <circle cx="660" cy="156" r="8" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <line x1="660" y1="148" x2="660" y2="136" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="2" transform="rotate(0 660 156)"/>
    <line x1="660" y1="148" x2="660" y2="136" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="2" transform="rotate(120 660 156)"/>
    <line x1="660" y1="148" x2="660" y2="136" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="2" transform="rotate(240 660 156)"/>
    <path d="M486 250 L 506 212 H 694 L 714 250" fill="#0f172a" stroke="#334155"/>
    <text x="600" y="236" font-size="9" fill="#64748b">the whole session, committed</text>
    <path d="M790 150 H 850" stroke="#38bdf8" stroke-width="2"/>
    <path d="M860 138 l20 12 l-20 12 z" fill="#38bdf8"/>
    <text x="870" y="124" font-size="11" fill="#38bdf8">replay</text>
    <line x1="890" y1="150" x2="982.0" y2="150.0" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/><path d="M990 150 L980.0 145.0 L980.0 155.0 z" fill="#38bdf8"/>
    <rect x="1000" y="134" width="120" height="32" rx="6" fill="#0b1120" stroke="#38bdf8" stroke-opacity="0.55"/><text x="1060.0" y="154.0" font-size="11" fill="#e2e8f0">agent</text>
    <text x="1060" y="196" font-size="10" fill="#94a3b8">no network · no key · instant</text>
    <rect x="950" y="212" width="220" height="22" rx="6" fill="#0b1120" stroke="#38bdf8" stroke-opacity="0.55"/><text x="1060.0" y="226.6" font-size="10" fill="#7dd3fc">MCP_CASSETTE_MODE=none</text>
  </g>
</svg>
