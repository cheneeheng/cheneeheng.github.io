<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" role="img" aria-label="A path check correctly guarding everything inside a sandbox whose root is chosen by an untrusted request field">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#f8fafc" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="400" height="340" fill="url(#bg)"/>
  <rect width="400" height="340" fill="url(#dots)"/>
  <rect width="400" height="340" fill="url(#glow)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="middle">
    <rect x="14" y="10" width="372" height="62" rx="12" fill="#0b1120" stroke="#f87171" stroke-opacity="0.6"/>
    <text x="200" y="34" font-size="12" fill="#e2e8f0">POST /api/reviews</text>
    <text x="200" y="58" font-size="12" fill="#fca5a5">{ "pr_id": "../.." }</text>
    <line x1="200" y1="74" x2="200.0" y2="86.0" stroke="#f87171" stroke-width="2" stroke-linecap="round"/><path d="M200 94 L205.0 84.0 L195.0 84.0 z" fill="#f87171"/>
    <text x="212" y="88" font-size="10" fill="#64748b" text-anchor="start">joined, unvalidated</text>
    <rect x="40" y="98" width="320" height="156" rx="12" fill="none" stroke="#f87171" stroke-width="2"/>
    <text x="350" y="116" font-size="10" fill="#f87171" text-anchor="end">actual root, chosen by caller</text>
    <rect x="58" y="123" width="14" height="11" rx="2" fill="#a78bfa" fill-opacity="0.4"/>
    <text x="80" y="133" font-size="12" fill="#e2e8f0" text-anchor="start">/</text>
    <path d="M76 146 V 166 H 96" fill="none" stroke="#475569" stroke-width="1.5"/>
    <rect x="98" y="157" width="14" height="11" rx="2" fill="#a78bfa" fill-opacity="0.4"/>
    <text x="120" y="167" font-size="12" fill="#e2e8f0" text-anchor="start">.../</text>
    <path d="M116 180 V 200 H 136" fill="none" stroke="#475569" stroke-width="1.5"/>
    <rect x="138" y="191" width="14" height="11" rx="2" fill="#a78bfa" fill-opacity="0.4"/>
    <text x="160" y="201" font-size="12" fill="#e2e8f0" text-anchor="start">reviews/</text>
    <path d="M156 214 V 234 H 176" fill="none" stroke="#475569" stroke-width="1.5"/>
    <rect x="178" y="225" width="14" height="11" rx="2" fill="#a78bfa" fill-opacity="0.4"/>
    <text x="200" y="235" font-size="12" fill="#e2e8f0" text-anchor="start">&lt;pr_id&gt;/</text>
    <rect x="176" y="222" width="150" height="26" rx="7" fill="none" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="176" y="270" font-size="10" fill="#4ade80" text-anchor="start">intended root</text>
    <rect x="14" y="280" width="372" height="52" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-opacity="0.5"/>
    <path d="M33 298 l3.5 3.5 l6.5 -7" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="52" y="302" font-size="12" fill="#c4b5fd" text-anchor="start">resolve_in_sandbox</text>
    <text x="200" y="322" font-size="10" fill="#94a3b8">every path checked, correctly</text>
  </g>
</svg>
