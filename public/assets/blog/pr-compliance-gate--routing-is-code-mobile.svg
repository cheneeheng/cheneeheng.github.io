<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" role="img" aria-label="A rule ladder routing a review to investigate, human, or verdict, with accumulated stale findings blocking the clean path">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#f8fafc" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="400" height="340" fill="url(#bg)"/>
  <rect width="400" height="340" fill="url(#dots)"/>
  <rect width="400" height="340" fill="url(#glow)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="middle">
    <text x="200" y="18" font-size="10" fill="#64748b">reconcile · plain python · no model call</text>
    <line x1="20" y1="30" x2="20" y2="176" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <line x1="380" y1="30" x2="380" y2="176" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <line x1="20" y1="54" x2="380" y2="54" stroke="#334155" stroke-width="3"/>
    <rect x="34" y="40" width="332" height="28" rx="6" fill="#0b1120" stroke="#a78bfa" stroke-opacity="0.55"/><text x="200.0" y="58.0" font-size="11" fill="#c4b5fd">blocking / timeout -> human</text>
    <line x1="20" y1="100" x2="380" y2="100" stroke="#334155" stroke-width="3"/>
    <rect x="34" y="86" width="332" height="28" rx="6" fill="#0b1120" stroke="#fbbf24" stroke-opacity="0.55"/><text x="200.0" y="104.0" font-size="11" fill="#fcd34d">needs_context + budget -> investigate</text>
    <line x1="20" y1="146" x2="380" y2="146" stroke="#334155" stroke-width="3"/>
    <rect x="34" y="132" width="332" height="28" rx="6" fill="#0b1120" stroke="#475569" stroke-opacity="0.55" stroke-dasharray="4 4"/><text x="200.0" y="150.0" font-size="11" fill="#64748b">clean -> verdict  (unreachable)</text>
    <text x="14" y="202" font-size="11" fill="#c4b5fd" text-anchor="start">findings  (operator.add)</text>
    <rect x="14" y="212" width="350" height="22" rx="6" fill="#0b1120" stroke="#f87171" stroke-opacity="0.55"/><text x="189.0" y="227.0" font-size="11" fill="#fca5a5">round 1 · needs_more_context</text>
    <rect x="14" y="238" width="350" height="22" rx="6" fill="#0b1120" stroke="#f87171" stroke-opacity="0.55"/><text x="189.0" y="253.0" font-size="11" fill="#fca5a5">round 1 · needs_more_context</text>
    <rect x="14" y="270" width="350" height="22" rx="6" fill="#0b1120" stroke="#475569" stroke-opacity="0.55"/><text x="189.0" y="285.0" font-size="11" fill="#94a3b8">round 2 · clean</text>
    <rect x="14" y="296" width="350" height="22" rx="6" fill="#0b1120" stroke="#475569" stroke-opacity="0.55"/><text x="189.0" y="311.0" font-size="11" fill="#94a3b8">round 2 · clean</text>
    <path d="M364 224 C 394 224, 394 100, 368 100" fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="5 4"/>
    <path d="M366 100 l10 -6 v12 z" fill="#f87171"/>
    <text x="200" y="334" font-size="11" fill="#94a3b8">the list never forgets round 1</text>
  </g>
</svg>
