<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" role="img" aria-label="A proxy stalled mid-stream on a buffered read, an argument parser swallowing flags after the first positional, and a shutdown that terminates its child and exits with code 130">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#f8fafc" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="400" height="340" fill="url(#bg)"/>
  <rect width="400" height="340" fill="url(#dots)"/>
  <rect width="400" height="340" fill="url(#glow)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="middle">
    <text x="14" y="24" font-size="11" fill="#64748b" text-anchor="start">stdin</text>
    <text x="210" y="40" font-size="11" fill="#f87171">read(n) waits for n bytes</text>
    <path d="M22 52 V 48 H 378 V 52" fill="none" stroke="#f87171" stroke-width="1.5"/>
    <rect x="14" y="56" width="372" height="28" rx="7" fill="#0b1120" stroke="#334155"/>
    <rect x="22" y="63" width="12" height="14" rx="3" fill="#38bdf8" fill-opacity="0.55"/>
    <rect x="38" y="63" width="12" height="14" rx="3" fill="#38bdf8" fill-opacity="0.55"/>
    <rect x="54" y="63" width="12" height="14" rx="3" fill="#38bdf8" fill-opacity="0.55"/>
    <rect x="70" y="63" width="12" height="14" rx="3" fill="#38bdf8" fill-opacity="0.55"/>
    <rect x="86" y="63" width="12" height="14" rx="3" fill="#38bdf8" fill-opacity="0.55"/>
    <rect x="102" y="63" width="12" height="14" rx="3" fill="#38bdf8" fill-opacity="0.55"/>
    <rect x="118" y="63" width="12" height="14" rx="3" fill="#38bdf8" fill-opacity="0.55"/>
    <rect x="134" y="63" width="12" height="14" rx="3" fill="#38bdf8" fill-opacity="0.55"/>
    <rect x="150" y="63" width="12" height="14" rx="3" fill="#38bdf8" fill-opacity="0.55"/>
    <rect x="166" y="63" width="12" height="14" rx="3" fill="#38bdf8" fill-opacity="0.55"/>
    <rect x="182" y="63" width="12" height="14" rx="3" fill="#38bdf8" fill-opacity="0.55"/>
    <rect x="198" y="63" width="12" height="14" rx="3" fill="#38bdf8" fill-opacity="0.55"/>
    <rect x="214" y="61" width="164" height="18" rx="4" fill="none" stroke="#475569" stroke-dasharray="4 4"/>
    <text x="200" y="102" font-size="11" fill="#94a3b8">one short line, then nothing</text>
    <text x="14" y="132" font-size="11" fill="#64748b" text-anchor="start">argv</text>
    <rect x="28" y="142" width="64" height="26" rx="6" fill="#0b1120" stroke="#38bdf8" stroke-opacity="0.55"/><text x="60.0" y="159.0" font-size="11" fill="#7dd3fc">serve</text>
    <rect x="100" y="142" width="96" height="26" rx="6" fill="#0b1120" stroke="#38bdf8" stroke-opacity="0.55"/><text x="148.0" y="159.0" font-size="11" fill="#7dd3fc">demo.json</text>
    <rect x="204" y="142" width="88" height="26" rx="6" fill="#0b1120" stroke="#f87171" stroke-opacity="0.55"/><text x="248.0" y="159.0" font-size="11" fill="#fca5a5">--faults</text>
    <rect x="300" y="142" width="72" height="26" rx="6" fill="#0b1120" stroke="#f87171" stroke-opacity="0.55"/><text x="336.0" y="159.0" font-size="11" fill="#fca5a5">f.json</text>
    <path d="M204 172 V 178 H 368 V 172" fill="none" stroke="#f87171" stroke-width="1.5"/>
    <text x="286" y="194" font-size="10" fill="#f87171">REMAINDER swallowed them</text>
    <text x="200" y="216" font-size="11" fill="#94a3b8">fix: split argv on the first --</text>
    <text x="14" y="240" font-size="11" fill="#64748b" text-anchor="start">exit</text>
    <rect x="14" y="250" width="150" height="26" rx="6" fill="#0b1120" stroke="#38bdf8" stroke-opacity="0.55"/><text x="89.0" y="267.0" font-size="11" fill="#7dd3fc">terminate child</text>
    <line x1="166" y1="263" x2="172.0" y2="263.0" stroke="#64748b" stroke-width="2" stroke-linecap="round"/><path d="M180 263 L170.0 258.0 L170.0 268.0 z" fill="#64748b"/>
    <rect x="182" y="250" width="204" height="26" rx="6" fill="#0b1120" stroke="#38bdf8" stroke-opacity="0.55"/><text x="284.0" y="267.0" font-size="11" fill="#7dd3fc">_finalize() writes cassette</text>
    <line x1="284" y1="278" x2="179.9" y2="296.6" stroke="#64748b" stroke-width="2" stroke-linecap="round"/><path d="M172 298 L182.7 301.2 L181.0 291.3 z" fill="#64748b"/>
    <rect x="14" y="288" width="150" height="26" rx="6" fill="#0b1120" stroke="#fbbf24" stroke-opacity="0.55"/><text x="89.0" y="305.0" font-size="11" fill="#fcd34d">os._exit(130)</text>
    <text x="200" y="330" font-size="11" fill="#94a3b8">blunt, but the file is safe</text>
  </g>
</svg>
