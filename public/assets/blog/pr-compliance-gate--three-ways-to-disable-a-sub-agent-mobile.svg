<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" role="img" aria-label="Three separate faults, an event loop, a missing API key, and a lost structured-output guarantee, all producing the same silently broken sub-agent">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#f8fafc" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="400" height="340" fill="url(#bg)"/>
  <rect width="400" height="340" fill="url(#dots)"/>
  <rect width="400" height="340" fill="url(#glow)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="middle">
    <text x="14" y="26" font-size="11" fill="#94a3b8" text-anchor="start">src/gate</text>
    <rect x="84" y="15" width="220" height="14" rx="7" fill="#4ade80" fill-opacity="0.45"/>
    <text x="312" y="26" font-size="11" fill="#4ade80" text-anchor="start">100% green</text>
    <line x1="14" y1="48" x2="386" y2="48" stroke="#64748b" stroke-width="1.5" stroke-dasharray="10 6"/>
    <text x="14" y="64" font-size="10" fill="#64748b" text-anchor="start">stubbed boundary</text>
    <rect x="14" y="76" width="316" height="50" rx="10" fill="#1e293b" stroke="#f87171" stroke-opacity="0.55"/>
    <text x="172" y="98" font-size="12" fill="#fca5a5">SelectorEventLoop</text>
    <text x="172" y="116" font-size="10" fill="#64748b">cannot spawn a subprocess</text>
    <line x1="330" y1="101" x2="360" y2="101" stroke="#f87171" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="14" y="136" width="316" height="50" rx="10" fill="#1e293b" stroke="#f87171" stroke-opacity="0.55"/>
    <text x="172" y="158" font-size="12" fill="#fca5a5">ANTHROPIC_API_KEY</text>
    <text x="172" y="176" font-size="10" fill="#64748b">never reaches os.environ</text>
    <line x1="330" y1="161" x2="360" y2="161" stroke="#f87171" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="14" y="196" width="316" height="50" rx="10" fill="#1e293b" stroke="#f87171" stroke-opacity="0.55"/>
    <text x="172" y="218" font-size="12" fill="#fca5a5">function_calling</text>
    <text x="172" y="236" font-size="10" fill="#64748b">guarantee lost to thinking</text>
    <line x1="330" y1="221" x2="360" y2="221" stroke="#f87171" stroke-opacity="0.5" stroke-width="2"/>
    <line x1="360" y1="101" x2="360" y2="272" stroke="#f87171" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="14" y="274" width="372" height="44" rx="12" fill="#0b1120" stroke="#f87171" stroke-opacity="0.7"/>
    <text x="200" y="294" font-size="11" fill="#fca5a5">one symptom:</text>
    <text x="200" y="310" font-size="11" fill="#fca5a5">the investigator does nothing</text>
  </g>
</svg>
