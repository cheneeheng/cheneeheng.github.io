<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" role="img" aria-label="An open journal: the top page holds lines of writing, the bottom page a SKILL.md file whose description line is lit up while the rest of the file stays dim">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#f8fafc" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="400" height="560" fill="url(#bg)"/>
  <rect width="400" height="560" fill="url(#dots)"/>
  <rect width="400" height="560" fill="url(#glow)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" fill="#94a3b8">

    <!-- top page: the journal entry -->
    <g transform="translate(38 30) scale(1.2)">
      <rect width="270" height="200" rx="14" fill="#1e293b" stroke="#334155"/>
      <g stroke="#334155">
        <line x1="30" y1="66" x2="240" y2="66"/>
        <line x1="30" y1="90" x2="240" y2="90"/>
        <line x1="30" y1="114" x2="240" y2="114"/>
        <line x1="30" y1="138" x2="240" y2="138"/>
        <line x1="30" y1="162" x2="240" y2="162"/>
      </g>
      <g fill="#a78bfa">
        <rect x="30" y="58" width="190" height="4" rx="2" fill-opacity="0.85"/>
        <rect x="30" y="82" width="160" height="4" rx="2" fill-opacity="0.6"/>
        <rect x="30" y="106" width="205" height="4" rx="2" fill-opacity="0.75"/>
        <rect x="30" y="130" width="120" height="4" rx="2" fill-opacity="0.5"/>
        <rect x="30" y="154" width="175" height="4" rx="2" fill-opacity="0.65"/>
      </g>
    </g>

    <!-- bottom page: a SKILL.md, only its description loaded -->
    <g transform="translate(38 290) scale(1.2)">
      <rect width="270" height="200" rx="14" fill="#1e293b" stroke="#334155"/>
      <text x="30" y="40">SKILL.md</text>
      <line x1="30" y1="52" x2="240" y2="52" stroke="#334155"/>
      <text x="30" y="80" fill="#475569">---</text>
      <rect x="24" y="88" width="222" height="26" rx="6" fill="#a78bfa" fill-opacity="0.15" stroke="#a78bfa" stroke-opacity="0.6"/>
      <text x="32" y="107" fill="#c4b5fd">description:</text>
      <rect x="160" y="99" width="74" height="4" rx="2" fill="#a78bfa"/>
      <text x="30" y="136" fill="#475569">---</text>
      <g fill="#475569" fill-opacity="0.6">
        <rect x="30" y="150" width="180" height="4" rx="2"/>
        <rect x="30" y="164" width="150" height="4" rx="2"/>
        <rect x="30" y="178" width="195" height="4" rx="2"/>
      </g>
      <polygon points="230,0 250,0 250,46 240,36 230,46" fill="#a78bfa"/>
    </g>

  </g>
</svg>
