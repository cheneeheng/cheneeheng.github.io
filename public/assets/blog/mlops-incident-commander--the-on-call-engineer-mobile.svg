<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" role="img" aria-label="Three concentric rings, a simulated world on the outside, a sensing layer in the middle, and the reasoning agents at the centre">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.7">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#f8fafc" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="400" height="340" fill="url(#bg)"/>
  <rect width="400" height="340" fill="url(#dots)"/>
  <rect width="400" height="340" fill="url(#glow)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="middle">
    <circle cx="200" cy="170" r="150" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-width="2" stroke-dasharray="6 6"/>
    <circle cx="200" cy="170" r="98" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <circle cx="200" cy="170" r="48" fill="#0b1120" stroke="#fbbf24" stroke-width="2"/>
    <text x="200" y="44" font-size="13" fill="#64748b">simulated world</text>
    <text x="200" y="62" font-size="11" fill="#475569">traffic · faults · cnn</text>
    <text x="200" y="96" font-size="13" fill="#94a3b8">sensing</text>
    <text x="200" y="112" font-size="11" fill="#64748b">windows · mcp</text>
    <text x="200" y="168" font-size="14" fill="#fcd34d">agents</text>
    <text x="200" y="186" font-size="11" fill="#94a3b8">reasoning</text>
    <text x="200" y="250" font-size="11" fill="#94a3b8">honest boundary</text>
    <text x="200" y="302" font-size="11" fill="#64748b">scaffolding</text>
  </g>
</svg>
