<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="A scorecard fed by hidden ground truth, with a dashed path where postmortem memory quietly carries the answer back to the diagnosis agent">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.55" cy="0.85" r="0.6">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#f8fafc" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="middle">
    <rect x="50" y="40" width="210" height="70" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="155" y="68" font-size="12" fill="#e2e8f0">injection</text>
    <text x="155" y="90" font-size="10" fill="#fcd34d">ground_truth_fault</text>

    <rect x="460" y="40" width="240" height="70" rx="12" fill="#1e293b" stroke="#475569"/>
    <text x="580" y="68" font-size="12" fill="#e2e8f0">diagnosis agent</text>
    <text x="580" y="90" font-size="10" fill="#64748b">mcp tools · is_faulty omitted</text>

    <path d="M260 75 H 450" stroke="#475569" stroke-width="2" stroke-dasharray="4 6"/>
    <circle cx="355" cy="75" r="13" fill="#0b1120" stroke="#f87171" stroke-width="2"/>
    <path d="M349 69 l12 12 M361 69 l-12 12" stroke="#f87171" stroke-width="2" stroke-linecap="round"/>
    <text x="355" y="52" font-size="10" fill="#94a3b8">withheld</text>

    <rect x="900" y="40" width="250" height="110" rx="14" fill="#1e293b" stroke="#4ade80" stroke-opacity="0.5"/>
    <text x="1025" y="66" font-size="12" fill="#e2e8f0">scorecard · 13 cases</text>
    <text x="1025" y="90" font-size="10" fill="#94a3b8">detection recall</text>
    <text x="1025" y="106" font-size="10" fill="#94a3b8">diagnosis accuracy</text>
    <text x="1025" y="122" font-size="10" fill="#94a3b8">mean ttd · cost</text>
    <path d="M700 75 H 890" stroke="#475569" stroke-width="2"/>
    <path d="M155 40 V 22 H 1025 V 40" fill="none" stroke="#4ade80" stroke-opacity="0.5" stroke-width="2"/>
    <text x="760" y="14" font-size="10" fill="#86efac">only the eval runner reads it, to score</text>

    <rect x="460" y="190" width="240" height="76" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-opacity="0.7"/>
    <text x="580" y="216" font-size="12" fill="#fcd34d">postmortem memory</text>
    <text x="580" y="236" font-size="10" fill="#94a3b8">## Ground truth vs diagnosis</text>
    <text x="580" y="254" font-size="10" fill="#64748b">top-3 recalled · pgvector</text>
    <path d="M155 110 C 155 200, 300 228, 450 228" fill="none" stroke="#fbbf24" stroke-opacity="0.7" stroke-width="2"/>
    <text x="270" y="250" font-size="10" fill="#fcd34d">postmortem is handed the truth</text>
    <path d="M640 190 V 118" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3 7" stroke-linecap="round"/>
    <path d="M634 124 l6 -10 l6 10" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="655" y="158" font-size="10" fill="#fcd34d" text-anchor="start">the answer key, back in</text>
    <path d="M700 228 H 900" stroke="#334155" stroke-width="2"/>
    <rect x="900" y="208" width="250" height="40" rx="10" fill="#0b1120" stroke="#334155"/>
    <text x="1025" y="233" font-size="11" fill="#cbd5e1">strip_ground_truth()</text>
    <text x="800" y="220" font-size="10" fill="#64748b">fix, 26 aug</text>
  </g>
</svg>
