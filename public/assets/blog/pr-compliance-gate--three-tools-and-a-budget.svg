<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="A sub-agent with three read-only tools inside a sandbox, its turn, tool-call, and byte budgets counted outside it by the harness">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#f8fafc" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="middle">

    <!-- 1: the toolbox -->
    <g transform="translate(90 70)">
      <rect width="300" height="160" rx="16" fill="#1e293b" stroke="#334155"/>
      <g font-size="10">
        <g transform="translate(34 38)"><rect width="232" height="20" rx="5" fill="#0b1120" stroke="#475569"/><text x="116" y="14" fill="#94a3b8">read_file</text></g>
        <g transform="translate(34 62)"><rect width="232" height="20" rx="5" fill="#0b1120" stroke="#475569"/><text x="116" y="14" fill="#94a3b8">grep_repo</text></g>
        <g transform="translate(34 86)"><rect width="232" height="20" rx="5" fill="#0b1120" stroke="#475569"/><text x="116" y="14" fill="#94a3b8">list_dir</text></g>
      </g>
      <text x="150" y="130" font-size="10" fill="#64748b">no write · no exec · no net</text>
      <text x="150" y="150">the whole toolbox</text>
    </g>

    <!-- 2: budgets counted outside -->
    <g transform="translate(450 70)">
      <rect width="300" height="160" rx="16" fill="#1e293b" stroke="#334155"/>
      <rect x="86" y="36" width="128" height="52" rx="9" fill="#0b1120" stroke="#a78bfa" stroke-opacity="0.5"/>
      <text x="150" y="66" font-size="10" fill="#c4b5fd">sub-agent</text>
      <g font-size="9" fill="#64748b">
        <g transform="translate(28 98)"><rect width="76" height="18" rx="4" fill="#0b1120" stroke="#475569"/><text x="38" y="13">turns</text></g>
        <g transform="translate(112 98)"><rect width="76" height="18" rx="4" fill="#0b1120" stroke="#475569"/><text x="38" y="13">tool calls</text></g>
        <g transform="translate(196 98)"><rect width="76" height="18" rx="4" fill="#0b1120" stroke="#475569"/><text x="38" y="13">bytes</text></g>
      </g>
      <text x="150" y="148">the harness counts, not the model</text>
    </g>

    <!-- 3: it never raises -->
    <g transform="translate(810 70)">
      <rect width="300" height="160" rx="16" fill="#1e293b" stroke="#334155"/>
      <g font-size="10">
        <g transform="translate(38 40)"><rect width="224" height="22" rx="5" fill="#0b1120" stroke="#475569"/><text x="112" y="15" fill="#94a3b8">budget exhausted</text></g>
        <g transform="translate(38 68)"><rect width="224" height="22" rx="5" fill="#0b1120" stroke="#a78bfa" stroke-opacity="0.5"/><text x="112" y="15" fill="#c4b5fd">inconclusive report</text></g>
        <g transform="translate(38 96)"><rect width="224" height="22" rx="5" fill="#0b1120" stroke="#60a5fa" stroke-opacity="0.55"/><text x="112" y="15" fill="#93c5fd">a human decides</text></g>
      </g>
      <text x="150" y="150">never a stack trace</text>
    </g>

  </g>
</svg>
