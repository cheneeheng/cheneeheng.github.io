<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="A sub-agent with three read-only tools inside a sandbox, its turn, tool-call, and byte budgets counted outside it by the harness">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#f8fafc" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="middle">
    <rect x="60" y="40" width="480" height="230" rx="18" fill="none" stroke="#a78bfa" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="80" y="62" font-size="10" fill="#a78bfa" text-anchor="start">sandbox · read-only</text>
    <rect x="220" y="84" width="160" height="56" rx="28" fill="#1e293b" stroke="#a78bfa" stroke-opacity="0.7"/>
    <text x="300" y="117" font-size="12" fill="#e2e8f0">investigator</text>
    <line x1="300" y1="140" x2="150" y2="184" stroke="#475569" stroke-width="1.5"/>
    <rect x="90" y="184" width="120" height="28" rx="6" fill="#0b1120" stroke="#a78bfa" stroke-opacity="0.55"/><text x="150.0" y="202.0" font-size="11" fill="#c4b5fd">read_file</text>
    <line x1="300" y1="140" x2="300" y2="184" stroke="#475569" stroke-width="1.5"/>
    <rect x="240" y="184" width="120" height="28" rx="6" fill="#0b1120" stroke="#a78bfa" stroke-opacity="0.55"/><text x="300.0" y="202.0" font-size="11" fill="#c4b5fd">grep_repo</text>
    <line x1="300" y1="140" x2="450" y2="184" stroke="#475569" stroke-width="1.5"/>
    <rect x="390" y="184" width="120" height="28" rx="6" fill="#0b1120" stroke="#a78bfa" stroke-opacity="0.55"/><text x="450.0" y="202.0" font-size="11" fill="#c4b5fd">list_dir</text>
    <text x="300" y="246" font-size="10" fill="#64748b">no write · no exec · no net</text>
    <text x="620" y="62" font-size="11" fill="#94a3b8" text-anchor="start">the harness counts, not the model</text>
    <text x="620" y="98" font-size="10" fill="#c4b5fd" text-anchor="start">MAX_TURNS</text>
    <rect x="780" y="86" width="340" height="16" rx="8" fill="#0b1120" stroke="#334155"/>
    <rect x="780" y="86" width="187" height="16" rx="8" fill="#a78bfa" fill-opacity="0.5"/>
    <line x1="1120" y1="82" x2="1120" y2="106" stroke="#f87171" stroke-width="2"/>
    <text x="620" y="142" font-size="10" fill="#c4b5fd" text-anchor="start">MAX_TOOL_CALLS</text>
    <rect x="780" y="130" width="340" height="16" rx="8" fill="#0b1120" stroke="#334155"/>
    <rect x="780" y="130" width="272" height="16" rx="8" fill="#a78bfa" fill-opacity="0.5"/>
    <line x1="1120" y1="126" x2="1120" y2="150" stroke="#f87171" stroke-width="2"/>
    <text x="620" y="186" font-size="10" fill="#c4b5fd" text-anchor="start">MAX_FILE_CHARS</text>
    <rect x="780" y="174" width="340" height="16" rx="8" fill="#0b1120" stroke="#334155"/>
    <rect x="780" y="174" width="119" height="16" rx="8" fill="#a78bfa" fill-opacity="0.5"/>
    <line x1="1120" y1="170" x2="1120" y2="194" stroke="#f87171" stroke-width="2"/>
    <rect x="620" y="226" width="160" height="28" rx="6" fill="#0b1120" stroke="#a78bfa" stroke-opacity="0.55"/><text x="700.0" y="243.6" font-size="10" fill="#c4b5fd">budget exhausted</text>
    <line x1="782" y1="240" x2="790.0" y2="240.0" stroke="#64748b" stroke-width="2" stroke-linecap="round"/><path d="M798 240 L788.0 235.0 L788.0 245.0 z" fill="#64748b"/>
    <rect x="802" y="226" width="180" height="28" rx="6" fill="#0b1120" stroke="#a78bfa" stroke-opacity="0.55"/><text x="892.0" y="243.6" font-size="10" fill="#c4b5fd">inconclusive report</text>
    <line x1="984" y1="240" x2="992.0" y2="240.0" stroke="#64748b" stroke-width="2" stroke-linecap="round"/><path d="M1000 240 L990.0 235.0 L990.0 245.0 z" fill="#64748b"/>
    <rect x="1004" y="226" width="150" height="28" rx="6" fill="#0b1120" stroke="#a78bfa" stroke-opacity="0.55"/><text x="1079.0" y="243.6" font-size="10" fill="#c4b5fd">a human decides</text>
  </g>
</svg>
