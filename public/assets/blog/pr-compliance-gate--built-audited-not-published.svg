<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="A finished wheel and a complete publish workflow sitting behind a disabled file extension, waiting on live GitHub intake">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#f8fafc" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="middle">

    <!-- 1: the finished wheel -->
    <g transform="translate(90 70)">
      <rect width="300" height="160" rx="16" fill="#1e293b" stroke="#334155"/>
      <g font-size="9" text-anchor="start">
        <g transform="translate(30 34)"><rect width="240" height="18" rx="4" fill="#0b1120" stroke="#4ade80" stroke-opacity="0.5"/><text x="10" y="13" fill="#86efac">policy corpus bundled</text></g>
        <g transform="translate(30 56)"><rect width="240" height="18" rx="4" fill="#0b1120" stroke="#4ade80" stroke-opacity="0.5"/><text x="10" y="13" fill="#86efac">fixtures + UI bundled</text></g>
        <g transform="translate(30 78)"><rect width="240" height="18" rx="4" fill="#0b1120" stroke="#4ade80" stroke-opacity="0.5"/><text x="10" y="13" fill="#86efac">runs without a checkout</text></g>
      </g>
      <text x="150" y="124" font-size="10" fill="#64748b">uv build</text>
      <text x="150" y="150">the wheel is real</text>
    </g>

    <!-- 2: the workflow, disabled -->
    <g transform="translate(450 70)">
      <rect width="300" height="160" rx="16" fill="#1e293b" stroke="#334155"/>
      <g transform="translate(38 40)">
        <rect width="224" height="60" rx="8" fill="#0b1120" stroke="#a78bfa" stroke-opacity="0.4"/>
        <text x="112" y="22" font-size="9" fill="#c4b5fd">build · pip-audit · publish</text>
        <text x="112" y="42" font-size="10" fill="#94a3b8">publish.yml.disabled</text>
      </g>
      <text x="150" y="122" font-size="10" fill="#64748b">github never registers it</text>
      <text x="150" y="150">no trigger can fire</text>
    </g>

    <!-- 3: the gate -->
    <g transform="translate(810 70)">
      <rect width="300" height="160" rx="16" fill="#1e293b" stroke="#334155"/>
      <g font-size="10">
        <g transform="translate(38 40)"><rect width="224" height="24" rx="6" fill="#0b1120" stroke="#475569"/><text x="112" y="16" fill="#94a3b8">fixtures on disk</text></g>
        <g transform="translate(38 72)"><rect width="224" height="24" rx="6" fill="#0b1120" stroke="#a78bfa" stroke-opacity="0.55"/><text x="112" y="16" fill="#c4b5fd">live github intake</text></g>
      </g>
      <path d="M150 66 v6" stroke="#a78bfa" stroke-width="2"/>
      <path d="M150 74 l-5 -10 l10 0 z" fill="#a78bfa"/>
      <text x="150" y="122" font-size="10" fill="#64748b">this lands, then it ships</text>
      <text x="150" y="150">one door, both sides</text>
    </g>

  </g>
</svg>
