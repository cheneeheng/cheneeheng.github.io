<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="A recording proxy in front of a remote MCP server, with a server-initiated sampling request going to a stream that has no listener">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#f8fafc" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="middle">
    <rect x="90" y="36" width="180" height="30" rx="6" fill="#0b1120" stroke="#475569" stroke-opacity="0.55"/><text x="180.0" y="55.0" font-size="11" fill="#e2e8f0">agent</text>
    <line x1="180" y1="70" x2="180" y2="270" stroke="#334155" stroke-width="2" stroke-dasharray="4 6"/>
    <rect x="470" y="36" width="180" height="30" rx="6" fill="#0b1120" stroke="#475569" stroke-opacity="0.55"/><text x="560.0" y="55.0" font-size="11" fill="#e2e8f0">proxy · recording</text>
    <line x1="560" y1="70" x2="560" y2="270" stroke="#334155" stroke-width="2" stroke-dasharray="4 6"/>
    <rect x="850" y="36" width="180" height="30" rx="6" fill="#0b1120" stroke="#475569" stroke-opacity="0.55"/><text x="940.0" y="55.0" font-size="11" fill="#e2e8f0">server</text>
    <line x1="940" y1="70" x2="940" y2="270" stroke="#334155" stroke-width="2" stroke-dasharray="4 6"/>
    <line x1="180" y1="100" x2="548.0" y2="100.0" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/><path d="M556 100 L546.0 95.0 L546.0 105.0 z" fill="#38bdf8"/>
    <text x="370" y="92" font-size="10" fill="#7dd3fc">POST tools/call</text>
    <line x1="560" y1="100" x2="928.0" y2="100.0" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/><path d="M936 100 L926.0 95.0 L926.0 105.0 z" fill="#38bdf8"/>
    <text x="750" y="92" font-size="10" fill="#7dd3fc">POST · h11 · hand-framed SSE</text>
    <rect x="572" y="134" width="356" height="32" rx="8" fill="#0b1120" stroke="#475569" stroke-dasharray="4 4"/>
    <text x="750" y="154" font-size="10" fill="#64748b">GET stream · nobody listening</text>
    <line x1="940" y1="196" x2="608.0" y2="196.0" stroke="#f87171" stroke-width="2" stroke-linecap="round"/><path d="M600 196 L610.0 201.0 L610.0 191.0 z" fill="#f87171"/>
    <text x="770" y="188" font-size="11" fill="#fca5a5">create_message</text>
    <path d="M584 192 l8 8 M592 192 l-8 8" stroke="#f87171" stroke-width="2" stroke-linecap="round"/>
    <text x="770" y="216" font-size="10" fill="#f87171">no related_request_id -> nobody home</text>
    <path d="M180 118 V 256" stroke="#fbbf24" stroke-width="3" stroke-opacity="0.6"/>
    <text x="196" y="262" font-size="11" fill="#fbbf24" text-anchor="start">the recording just hung</text>
  </g>
</svg>
