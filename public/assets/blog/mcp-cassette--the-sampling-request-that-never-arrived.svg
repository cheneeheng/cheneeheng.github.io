<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="A recording proxy in front of a remote MCP server, with a server-initiated sampling request going to a stream that has no listener">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#f8fafc" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="middle">

    <!-- 1: proxy in front of a remote url -->
    <g transform="translate(70 70)">
      <rect width="300" height="160" rx="16" fill="#1e293b" stroke="#334155"/>
      <g font-size="9">
        <rect x="20" y="46" width="72" height="30" rx="6" fill="#0b1120" stroke="#475569"/>
        <text x="56" y="65" fill="#94a3b8">agent</text>
        <rect x="114" y="46" width="72" height="30" rx="6" fill="#0b1120" stroke="#38bdf8" stroke-opacity="0.55"/>
        <text x="150" y="65" fill="#7dd3fc">proxy</text>
        <rect x="208" y="46" width="72" height="30" rx="6" fill="#0b1120" stroke="#475569"/>
        <text x="244" y="65" fill="#94a3b8">https</text>
      </g>
      <g stroke="#64748b" stroke-width="1.8" stroke-linecap="round">
        <line x1="92" y1="61" x2="112" y2="61"/>
        <line x1="186" y1="61" x2="206" y2="61"/>
      </g>
      <text x="150" y="100" font-size="10" fill="#64748b">Authorization forwarded, never stored</text>
      <text x="150" y="148">h11 + hand-framed SSE</text>
    </g>

    <!-- 2: the request with no listener -->
    <g transform="translate(430 70)">
      <rect width="340" height="160" rx="16" fill="#1e293b" stroke="#334155"/>
      <g font-size="9">
        <g transform="translate(28 40)"><rect width="130" height="24" rx="5" fill="#0b1120" stroke="#475569"/><text x="65" y="16" fill="#94a3b8">POST stream</text></g>
        <g transform="translate(28 76)"><rect width="130" height="24" rx="5" fill="#0b1120" stroke="#334155" stroke-dasharray="4 3"/><text x="65" y="16" fill="#475569">GET stream</text></g>
        <g transform="translate(196 58)"><rect width="116" height="24" rx="5" fill="#0b1120" stroke="#f87171" stroke-opacity="0.55"/><text x="58" y="16" fill="#fca5a5">create_message</text></g>
      </g>
      <path d="M196 88 L162 100" stroke="#f87171" stroke-width="1.8" stroke-dasharray="4 3" stroke-linecap="round"/>
      <text x="170" y="128" font-size="10" fill="#f87171">no related_request_id -&gt; nobody home</text>
      <text x="170" y="150">the recording just hung</text>
    </g>

    <!-- 3: checkpoint sidecar -->
    <g transform="translate(830 70)">
      <rect width="300" height="160" rx="16" fill="#1e293b" stroke="#334155"/>
      <g font-size="9">
        <g transform="translate(38 42)"><rect width="224" height="24" rx="5" fill="#0b1120" stroke="#38bdf8" stroke-opacity="0.5"/><text x="112" y="16" fill="#7dd3fc">cassette.json.partial</text></g>
        <g transform="translate(38 74)"><rect width="224" height="24" rx="5" fill="#0b1120" stroke="#475569"/><text x="112" y="16" fill="#94a3b8">every 5 seconds</text></g>
      </g>
      <text x="150" y="122" font-size="10" fill="#64748b">never at the cassette path</text>
      <text x="150" y="150">a hard kill costs 5 seconds</text>
    </g>

  </g>
</svg>
